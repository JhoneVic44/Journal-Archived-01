<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat | The Unspoken Chapters</title>

    <meta name="description" content="Converse with the Archivist about diary entries.">

    <!-- =========================
         SUPABASE
    ========================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =========================
         FONTS
    ========================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #0b0c0d;
            color: #eeeae1;
            font-family: "Manrope", Arial, sans-serif;
        }

        /* =========================
           LAYOUT
        ========================== */
        .ai-layout {
            display: flex;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.94), rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.05)),
                        radial-gradient(circle at 72% 18%, #3a3c3e, #202224 35%, #0b0c0d 72%);
        }

        /* =========================
           SIDEBAR
        ========================== */
        .sidebar {
            width: 280px;
            background: rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 22px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 25px;
            color: #eeeae1;
            letter-spacing: -0.03em;
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }

        .sidebar-item:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.15);
        }

        .sidebar-item.active {
            background: rgba(255,215,0,0.06);
            border-left: 2px solid rgba(255,215,0,0.5);
            border-color: rgba(255,215,0,0.3);
        }

        .sidebar-icon {
            font-size: 18px;
            opacity: 0.8;
        }

        .sidebar-text {
            font-size: 13px;
            color: #888;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        .sidebar-item:hover .sidebar-text,
        .sidebar-item.active .sidebar-text {
            color: #eeeae1;
        }

        /* =========================
           MAIN CHAT AREA
        ========================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* Chat header */
        .chat-header {
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11,12,13,0.5);
            backdrop-filter: blur(10px);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ai-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
            border: 1px solid rgba(255,215,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255,215,0,0.1);
        }

        .chat-header-info h2 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 16px;
            font-weight: 500;
            color: #eeeae1;
            margin-bottom: 2px;
        }

        .chat-header-info span {
            font-size: 9px;
            color: #aaa9a3;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: rgba(255,215,0,0.8);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Chat messages */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
        }

        /* Message bubbles */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai-message {
            justify-content: flex-start;
        }

        .message.user-message {
            justify-content: flex-end;
        }

        .message-icon {
            font-size: 18px;
            margin-top: 5px;
            opacity: 0.7;
            color: rgba(255,215,0,0.8);
        }

        .message-bubble {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.7;
        }

        .ai-message .message-bubble {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px 8px 8px 2px;
            color: #eeeae1;
        }

        .user-message .message-bubble {
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 8px 8px 2px 8px;
            color: #eeeae1;
        }

        .message-time {
            font-size: 9px;
            color: #5d5f62;
            margin-top: 5px;
            letter-spacing: 0.1em;
        }

        /* Input area */
        .chat-input-area {
            padding: 15px 30px 25px 30px;
            border-top: 1px solid rgba(255,255,255,0.06);
            background: rgba(11,12,13,0.5);
            backdrop-filter: blur(10px);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            color: #eeeae1;
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.06);
        }

        .chat-input::placeholder {
            color: #5d5f62;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 4px;
            color: #eeeae1;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: rgba(255,215,0,0.2);
            border-color: rgba(255,215,0,0.6);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================== */
        @media (max-width: 900px) {
            .ai-layout {
                flex-direction: column;
                height: 100dvh;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                padding: 10px;
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                gap: 5px;
            }

            .sidebar-header {
                font-size: 16px;
                padding: 0 10px;
                border-bottom: none;
                margin-bottom: 0;
                white-space: nowrap;
                align-self: center;
            }

            .sidebar-section {
                display: flex;
                gap: 5px;
                margin-bottom: 0;
            }

            .sidebar-item {
                padding: 8px 12px;
                white-space: nowrap;
                font-size: 11px;
                margin-bottom: 0;
            }

            .sidebar-icon {
                font-size: 14px;
            }

            .chat-header {
                padding: 10px 15px;
            }

            .chat-area {
                padding: 20px 15px;
            }

            .chat-input-area {
                padding: 10px 15px 15px 15px;
            }

            .message-bubble {
                max-width: 85%;
                padding: 12px 15px;
            }

            .chat-header-info h2 {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .chat-header {
                padding: 8px 12px;
            }

            .ai-avatar {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .chat-header-info h2 {
                font-size: 13px;
            }

            .chat-header-info span {
                font-size: 8px;
            }

            .chat-area {
                padding: 15px 12px;
            }

            .message {
                margin-bottom: 15px;
            }

            .message-bubble {
                font-size: 13px;
                line-height: 1.5;
                padding: 10px 14px;
            }

            .chat-input {
                padding: 12px 15px;
                font-size: 13px;
            }

            .send-btn {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .sidebar-header {
                font-size: 14px;
            }

            .sidebar-item {
                padding: 6px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="ai-layout">
        <!-- =========================
             SIDEBAR
        ========================== -->
        <div class="sidebar">
            <div class="sidebar-header">✦ The Archivist</div>

            <div class="sidebar-section">
                <div class="sidebar-item active" onclick="navigateTo('chat')">
                    <span class="sidebar-icon">✦</span>
                    <span class="sidebar-text">Ask AI</span>
                </div>
                <div class="sidebar-item" onclick="navigateTo('entrance')">
                    <span class="sidebar-icon">←</span>
                    <span class="sidebar-text">Back to Entrance</span>
                </div>
            </div>
        </div>

        <!-- =========================
             MAIN CHAT AREA
        ========================== -->
        <div class="main-content">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="ai-avatar">✦</div>
                    <div class="chat-header-info">
                        <h2>The Archivist</h2>
                        <span><span class="status-dot"></span> Searching the archive...</span>
                    </div>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-area" id="chatArea">
                <!-- Welcome message -->
                <div class="message ai-message">
                    <span class="message-icon">✦</span>
                    <div>
                        <div class="message-bubble">
                            Welcome, traveler. I am the Archivist, keeper of these pages. Ask me anything about the diary entries you find here, and I will search through the archive for you.
                        </div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Ask the Archivist..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">→</button>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================
         SUPABASE SCRIPT
    ========================== -->
    <script>
        // =================================================
        // SUPABASE CONFIGURATION
        // =================================================
        const SUPABASE_URL = "https://ktytetimukmaqkxmzkha.supabase.co";
        const SUPABASE_KEY = "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage
            }
        });

        console.log('✅ Supabase client created');

        // =================================================
        // GEMINI API CONFIGURATION (KEY REMOVED FOR SAFETY)
        // =================================================
        const GEMINI_API_KEY = ""; // <-- Leave this empty for now
        const FILE_SEARCH_STORE_NAME = "fileSearchStores/my-diary-archive-ej8tinp07uy3";
        const GEMINI_MODEL = "gemini-2.5-flash";

        // =================================================
        // CHAT FUNCTIONS
        // =================================================
        function navigateTo(destination) {
            switch(destination) {
                case 'chat':
                    // Stay on this page
                    break;
                case 'entrance':
                    window.location.href = './entrance.html';
                    break;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('user', message);
            
            // Clear input
            input.value = '';
            
            // Show thinking indicator
            const thinkingId = addThinkingIndicator();
            
            try {
                // Call Gemini API
                const aiResponse = await generateAIResponse(message);
                
                // Remove thinking indicator
                removeThinkingIndicator(thinkingId);
                
                // Add AI response
                addMessage('ai', aiResponse);
            } catch (error) {
                // Remove thinking indicator
                removeThinkingIndicator(thinkingId);
                
                // Add error message
                addMessage('ai', "The archive is silent on that topic. Please try again.");
                console.error('Error:', error);
            }
        }

        function addMessage(type, text) {
            const chatArea = document.getElementById('chatArea');
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            if (type === 'ai') {
                messageDiv.innerHTML = `
                    <span class="message-icon">✦</span>
                    <div>
                        <div class="message-bubble">${text}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div style="text-align: right;">
                        <div class="message-bubble">${text}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
            }
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addThinkingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';
            messageDiv.id = 'thinking-' + Date.now();
            
            messageDiv.innerHTML = `
                <span class="message-icon">✦</span>
                <div>
                    <div class="message-bubble">
                        <span class="thinking-dots">
                            <span>.</span><span>.</span><span>.</span>
                        </span>
                    </div>
                </div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            return messageDiv.id;
        }

        function removeThinkingIndicator(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        async function generateAIResponse(message) {
            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: message }] }],
                            tools: [{
                                fileSearch: {
                                    fileSearchStoreNames: [FILE_SEARCH_STORE_NAME]
                                }
                            }],
                            systemInstruction: {
                                parts: [{
                                    text: "You are the Archivist. Use ONLY the information from the uploaded diary to answer questions. If the diary does not contain the answer, say you cannot find it."
                                }]
                            }
                        })
                    }
                );

                const data = await response.json();
                
                // Extract the text from the response
                const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                
                // Return the text or a fallback message
                return text || "The archive is silent on that topic.";
                
            } catch (error) {
                console.error('Error calling Gemini API:', error);
                throw error;
            }
        }

        // =================================================
        // INITIALIZE
        // =================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Enter AI Chat loaded');
        });
    </script>
</body>
</html>
