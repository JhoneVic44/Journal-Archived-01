
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JhoneVic's Diary</title>

    <meta
        name="description"
        content="Sign in to The Unspoken Chapters."
    >

    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #0b0c0d,
                    #181a1c 50%,
                    #292b2d
                );

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           BACKGROUND
        ========================== */

        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;
        }


        .background::before {

            content: "";

            position: absolute;

            width: 800px;
            height: 800px;

            top: -400px;
            right: -150px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.03) 40%,
                    transparent 70%
                );
        }


        /* =========================
           NAVIGATION
        ========================== */

        nav {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            width: 100%;

            height: 85px;

            padding: 0 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            color: #f0ece3;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            white-space: nowrap;
        }


        .home-link {

            color: #aaa9a3;

            text-decoration: none;

            font-size: 10px;

            letter-spacing: 0.14em;

            text-transform: uppercase;

            transition:
                color 0.25s ease;
        }


        .home-link:hover {

            color: #eeeae1;
        }


        /* =========================
           LOGIN PAGE
        ========================== */

        main {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login {

            width: 100%;

            max-width: 520px;

            padding: 40px 25px 100px;

            text-align: center;
        }


        .eyebrow {

            margin-bottom: 24px;

            color: #777a7d;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        .login h1 {

            margin: 0;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    45px,
                    5.1vw,
                    68px
                );

            font-weight: 400;

            line-height: .95;

            letter-spacing: -0.05em;
        }


        .rule {

            width: 55px;

            height: 1px;

            margin:
                35px auto 25px;

            background:
                rgba(255,255,255,0.25);
        }


        .description {

            max-width: 330px;

            margin:
                0 auto 35px;

            color: #777a7d;

            font-size: 11px;

            line-height: 1.8;
        }


        /* =========================
           GOOGLE LOGIN BUTTON
        ========================== */

        .google-button {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 13px;

            width: 100%;

            max-width: 320px;

            height: 52px;

            margin: 0 auto;

            padding: 0 20px;

            border:
                1px solid
                rgba(255,255,255,0.20);

            border-radius: 4px;

            background: #ffffff;

            color: #202124;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.02em;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .google-button:hover {

            background: #f8f8f8;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);
        }


        .google-button:active {

            transform:
                translateY(0);
        }


        .google-button:disabled {

            opacity: 0.6;

            cursor: wait;

            transform: none;

            box-shadow: none;
        }


        /* =========================
           GOOGLE ICON
        ========================== */

        .google-icon {

            width: 20px;

            height: 20px;

            flex-shrink: 0;

            display: block;
        }


        .google-icon svg {

            display: block;

            width: 20px;

            height: 20px;
        }


        /* =========================
           MESSAGE
        ========================== */

        .message {

            min-height: 18px;

            margin:
                18px auto 0;

            color: #999b9d;

            font-size: 10px;

            line-height: 1.6;
        }


        .message.error {

            color: #c5a5a5;
        }


        .message.success {

            color: #a9bba9;
        }


        /* =========================
           NOTICE
        ========================== */

        .notice {

            max-width: 320px;

            margin:
                25px auto 0;

            color: #5d5f62;

            font-size: 9px;

            line-height: 1.7;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            position: fixed;

            left: 7%;

            bottom: 28px;

            z-index: 6;

            color: #5d5f62;

            font-size: 9px;

            letter-spacing: 0.2em;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            html,
            body {

                width: 100%;

                min-height: 100%;

                height: auto;

                overflow-x: hidden;

                overflow-y: auto;
            }


            nav {

                position: relative;

                top: auto;
                left: auto;
                right: auto;

                width: 100%;

                height: auto;

                padding:
                    22px 20px 18px;

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 20px;
            }


            .logo {

                font-size: 10px;
            }


            .home-link {

                font-size: 9px;

                white-space: nowrap;
            }


            main {

                width: 100%;

                height: auto;

                min-height:
                    calc(100vh - 80px);

                padding: 0;
            }


            .login {

                padding:
                    45px 25px 90px;
            }


            .login h1 {

                font-size:
                    clamp(
                        46px,
                        13vw,
                        64px
                    );
            }


            .description {

                max-width: 290px;

                font-size: 12px;
            }


            footer {

                position: relative;

                left: auto;

                bottom: auto;

                width: 100%;

                padding:
                    0 25px 30px;

                text-align: center;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================== */

        @media (max-width: 430px) {

            nav {

                padding:
                    20px 15px 16px;
            }


            .logo {

                font-size: 9px;
            }


            .home-link {

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            main {

                min-height:
                    calc(100vh - 70px);
            }


            .login {

                padding:
                    40px 20px 70px;
            }


            .login h1 {

                font-size:
                    clamp(
                        42px,
                        13vw,
                        58px
                    );
            }


            .eyebrow {

                font-size: 8px;
            }


            .description {

                font-size: 11px;
            }


            .google-button {

                height: 48px;

                font-size: 10px;
            }


            footer {

                font-size: 8px;
            }

        }

    </style>

</head>


<body>


<div class="background"></div>


<!-- =========================
     NAVIGATION
========================== -->

<nav>

    <div class="logo">
        JhoneVic's Diary
    </div>


    <a
        href="./index.html"
        class="home-link"
    >
        Home
    </a>

</nav>


<!-- =========================
     LOGIN
========================== -->

<main>

    <section class="login">

        <div class="eyebrow">
            The Archive
        </div>


        <h1>
            The Unspoken<br>
            Chapters
        </h1>


        <div class="rule"></div>


        <p class="description">
            Sign in with your Google account
            to access the private archive.
        </p>


        <!-- =========================
             GOOGLE LOGIN
        ========================== -->

        <button
            type="button"
            class="google-button"
            id="google-login"
        >

            <span
                class="google-icon"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        fill="#4285F4"
                        d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.22Z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.7c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.7Z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.54 13.8A5.85 5.85 0 0 1 6.23 12c0-.62.11-1.22.31-1.8V7.67H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.33l3.24-2.53Z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 6.17c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.27 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.7 5.37l3.24 2.53c.77-2.31 2.92-4.03 5.46-4.03Z"
                    />

                </svg>

            </span>


            <span id="google-login-text">
                Continue with Google
            </span>

        </button>


        <div
            class="message"
            id="login-message"
            aria-live="polite"
        ></div>


        <p class="notice">
            Access is restricted to
            authorized family members.
        </p>

    </section>

</main>


<footer>
    Personal Archive · 2013—2026
</footer>


<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

    const SUPABASE_URL =
        "https://ktytetimukmaqkxmzkha.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );


    /* =========================
       ELEMENTS
    ========================== */

    const googleButton =
        document.getElementById(
            "google-login"
        );


    const googleButtonText =
        document.getElementById(
            "google-login-text"
        );


    const loginMessage =
        document.getElementById(
            "login-message"
        );


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(
        message,
        type = ""
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "message " + type;

    }


    /* =========================
       EXISTING SESSION
    ========================== */

    async function checkExistingSession() {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session check error:",
                error
            );

            return;
        }


        if (
            data &&
            data.session &&
            data.session.user
        ) {

            window.location.replace(
                "./entrance.html"
            );

        }

    }


    /* =========================
       GOOGLE LOGIN
    ========================== */

    googleButton.addEventListener(
        "click",
        async function () {

            googleButton.disabled = true;

            googleButtonText.textContent =
                "Connecting...";


            showMessage("");


            console.log(
                "Starting Google authentication..."
            );


            const redirectTo =
                window.location.origin +
                "/Journal-Archived-01/entrance.html";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithOAuth({

                    provider:
                        "google",

                    options: {

                        redirectTo:
                            redirectTo

                    }

                });


            if (error) {

                console.error(
                    "Google login error:",
                    error
                );


                googleButton.disabled = false;

                googleButtonText.textContent =
                    "Continue with Google";


                showMessage(
                    "Google login failed. Please try again.",
                    "error"
                );


                return;

            }


            console.log(
                "Google authentication started.",
                data
            );

        }
    );


    /* =========================
       AUTH STATE
    ========================== */

    supabaseClient.auth.onAuthStateChange(
        function (
            event,
            session
        ) {

            console.log(
                "Login page auth event:",
                event
            );


            if (
                session &&
                session.user
            ) {

                window.location.replace(
                    "./entrance.html"
                );

            }

        }
    );


    /* =========================
       START
    ========================== */

    checkExistingSession();

</script>


</body>

</html>
