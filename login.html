<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JhoneVic's Diary</title>

    <meta
        name="description"
        content="Login to The Unspoken Chapters, a personal diary archive."
    >

    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #0b0c0d,
                    #181a1c 50%,
                    #292b2d
                );

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           BACKGROUND
        ========================== */

        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;
        }


        .background::before {

            content: "";

            position: absolute;

            width: 800px;
            height: 800px;

            top: -400px;
            right: -150px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.03) 40%,
                    transparent 70%
                );
        }


        /* =========================
           NAVIGATION
        ========================== */

        nav {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            width: 100%;

            height: 85px;

            padding: 0 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            color: #f0ece3;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            white-space: nowrap;
        }


        .links {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 32px;
        }


        .links a {

            color: #aaa9a3;

            text-decoration: none;

            font-size: 10px;

            letter-spacing: 0.14em;

            text-transform: uppercase;

            white-space: nowrap;

            transition:
                color 0.25s ease;
        }


        .links a:hover,
        .links .active {

            color: #eeeae1;
        }


        /* =========================
           LOGIN PAGE
        ========================== */

        main {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100vh;

            padding-top: 85px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login {

            width: 100%;

            max-width: 470px;

            padding:
                40px 25px 100px;

            text-align: center;
        }


        .eyebrow {

            margin-bottom: 24px;

            color: #777a7d;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        .login h1 {

            margin: 0;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    45px,
                    5.1vw,
                    68px
                );

            font-weight: 400;

            line-height: .95;

            letter-spacing: -0.05em;
        }


        .rule {

            width: 55px;

            height: 1px;

            margin:
                35px auto 25px;

            background:
                rgba(255,255,255,0.25);
        }


        .description {

            max-width: 330px;

            margin:
                0 auto 30px;

            color: #777a7d;

            font-size: 11px;

            line-height: 1.8;
        }


        /* =========================
           LOGIN FORM
        ========================== */

        .login-form {

            width: 100%;

            max-width: 320px;

            margin: 0 auto;
        }


        .field {

            width: 100%;

            margin-bottom: 14px;

            text-align: left;
        }


        .field label {

            display: block;

            margin-bottom: 7px;

            color: #777a7d;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 0.16em;

            text-transform: uppercase;
        }


        .field input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border:
                1px solid
                rgba(255,255,255,0.16);

            border-radius: 3px;

            outline: none;

            background:
                rgba(255,255,255,0.045);

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 12px;

            transition:
                border-color 0.25s ease,
                background 0.25s ease;
        }


        .field input::placeholder {

            color: #55585b;
        }


        .field input:focus {

            border-color:
                rgba(255,255,255,0.38);

            background:
                rgba(255,255,255,0.07);
        }


        /* =========================
           SIGN IN BUTTON
        ========================== */

        .login-button {

            width: 100%;

            height: 48px;

            margin-top: 8px;

            border:
                1px solid
                rgba(255,255,255,0.28);

            border-radius: 3px;

            background:
                rgba(255,255,255,0.10);

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.2s ease;
        }


        .login-button:hover {

            background:
                rgba(255,255,255,0.17);

            border-color:
                rgba(255,255,255,0.42);

            transform:
                translateY(-1px);
        }


        .login-button:disabled {

            opacity: 0.5;

            cursor: wait;

            transform: none;
        }


        /* =========================
           FORGOT PASSWORD
        ========================== */

        .forgot-password {

            display: inline-block;

            margin-top: 16px;

            color: #777a7d;

            text-decoration: none;

            font-size: 9px;

            letter-spacing: 0.08em;

            transition:
                color 0.25s ease;
        }


        .forgot-password:hover {

            color: #eeeae1;
        }


        /* =========================
           DIVIDER
        ========================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            max-width: 320px;

            margin:
                25px auto 18px;

            color: #5d5f62;

            font-size: 8px;

            letter-spacing: 0.18em;

            text-transform: uppercase;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,0.10);
        }


        /* =========================
           GOOGLE BUTTON
        ========================== */

        .google-button {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            max-width: 320px;

            height: 48px;

            margin: 0 auto;

            border:
                1px solid
                rgba(255,255,255,0.20);

            border-radius: 3px;

            background:
                rgba(255,255,255,0.03);

            color: #aaa9a3;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;
        }


        .google-button:hover {

            background:
                rgba(255,255,255,0.08);

            border-color:
                rgba(255,255,255,0.35);

            color: #eeeae1;
        }


        .google-button:disabled {

            opacity: 0.5;

            cursor: wait;
        }


        .google-icon {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 20px;

            height: 20px;

            border-radius: 50%;

            background: #ffffff;

            color: #4285f4;

            font-family:
                Arial,
                sans-serif;

            font-size: 13px;

            font-weight: 700;
        }


        /* =========================
           MESSAGE
        ========================== */

        .message {

            min-height: 18px;

            margin:
                16px auto 0;

            color: #999b9d;

            font-size: 10px;

            line-height: 1.6;
        }


        .message.error {

            color: #c5a5a5;
        }


        .message.success {

            color: #a9bba9;
        }


        /* =========================
           NOTICE
        ========================== */

        .notice {

            max-width: 320px;

            margin:
                25px auto 0;

            color: #5d5f62;

            font-size: 9px;

            line-height: 1.7;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            position: fixed;

            left: 7%;

            bottom: 28px;

            z-index: 6;

            color: #5d5f62;

            font-size: 9px;

            letter-spacing: 0.2em;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            html,
            body {

                width: 100%;

                min-height: 100%;

                height: auto;

                overflow-x: hidden;

                overflow-y: auto;
            }


            nav {

                position: relative;

                top: auto;
                left: auto;
                right: auto;

                width: 100%;

                height: auto;

                padding:
                    22px 20px 18px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: flex-start;

                gap: 18px;

                background:
                    rgba(11,12,13,0.97);

                backdrop-filter:
                    blur(10px);

                -webkit-backdrop-filter:
                    blur(10px);
            }


            .logo {

                width: 100%;

                text-align: center;

                font-size: 11px;

                line-height: 1.4;
            }


            .links {

                width: 100%;

                display: flex;

                flex-wrap: wrap;

                align-items: center;

                justify-content: center;

                gap:
                    12px 18px;
            }


            .links a {

                display: inline-block;

                padding:
                    3px 0;

                font-size: 9px;

                line-height: 1.5;
            }


            main {

                width: 100%;

                height: auto;

                min-height:
                    calc(100vh - 110px);

                padding-top: 0;
            }


            .login {

                padding:
                    55px 25px 90px;
            }


            .login h1 {

                font-size:
                    clamp(
                        46px,
                        13vw,
                        64px
                    );
            }


            .description {

                max-width: 290px;

                font-size: 12px;
            }


            footer {

                position: relative;

                left: auto;

                bottom: auto;

                width: 100%;

                padding:
                    0 25px 30px;

                text-align: center;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================== */

        @media (max-width: 430px) {

            nav {

                padding:
                    20px 15px 16px;

                gap: 16px;
            }


            .logo {

                font-size: 10px;
            }


            .links {

                gap:
                    10px 15px;
            }


            .links a {

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            main {

                min-height:
                    calc(100vh - 105px);
            }


            .login {

                padding:
                    45px 20px 70px;
            }


            .login h1 {

                font-size:
                    clamp(
                        42px,
                        13vw,
                        58px
                    );
            }


            .eyebrow {

                font-size: 8px;
            }


            .description {

                font-size: 11px;
            }


            .field input {

                height: 46px;

                font-size: 11px;
            }


            .login-button,
            .google-button {

                height: 46px;

                font-size: 8px;
            }


            .notice {

                font-size: 8px;
            }

        }

    </style>

</head>


<body>


<div class="background"></div>


<!-- =========================
     NAVIGATION
========================== -->

<nav>

    <div class="logo">

        JhoneVic's Diary

    </div>


    <div class="links">

        <a href="./index.html">
            Home
        </a>


        <a href="./introduction.html">
            Introduction
        </a>


        <a href="./reflections.html">
            Reflection | Photographs
        </a>


        <a href="./timeline.html">
            Timeline
        </a>


        <a
            href="./login.html"
            class="active"
        >
            Login
        </a>

    </div>

</nav>


<!-- =========================
     LOGIN
========================== -->

<main>

    <section class="login">

        <div class="eyebrow">
            The Archive
        </div>


        <h1>
            The Unspoken<br>
            Chapters
        </h1>


        <div class="rule"></div>


        <p class="description">
            Enter your family account
            to access the private archive.
        </p>


        <!-- =========================
             EMAIL + PASSWORD
        ========================== -->

        <form
            class="login-form"
            id="login-form"
        >

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="login-button"
            >

                <span id="login-button-text">
                    Sign In
                </span>

            </button>


            <a
                href="#"
                class="forgot-password"
                id="forgot-password"
            >
                Forgot password?
            </a>


            <div
                class="message"
                id="login-message"
                aria-live="polite"
            ></div>

        </form>


        <!-- =========================
             GOOGLE BACKUP
        ========================== -->

        <div class="divider">
            <span>or</span>
        </div>


        <button
            type="button"
            class="google-button"
            id="google-login"
        >

            <span class="google-icon">
                G
            </span>

            <span id="google-login-text">
                Continue with Google
            </span>

        </button>


        <p class="notice">
            Access is restricted to
            authorized family members.
        </p>

    </section>

</main>


<footer>
    Personal Archive · 2013—2026
</footer>


<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================
   ELEMENTS
========================== */

const loginForm =
    document.getElementById(
        "login-form"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


const loginButtonText =
    document.getElementById(
        "login-button-text"
    );


const googleButton =
    document.getElementById(
        "google-login"
    );


const googleButtonText =
    document.getElementById(
        "google-login-text"
    );


const loginMessage =
    document.getElementById(
        "login-message"
    );


const forgotPassword =
    document.getElementById(
        "forgot-password"
    );


/* =========================
   MESSAGE
========================== */

function showMessage(
    message,
    type = ""
) {

    loginMessage.textContent =
        message;

    loginMessage.className =
        "message " + type;

}


/* =========================
   EXISTING SESSION
========================== */

async function checkExistingSession() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Session check error:",
            error
        );

        return;

    }


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        window.location.replace(
            "./entrance.html"
        );

    }

}


/* =========================
   EMAIL + PASSWORD LOGIN
========================== */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        showMessage("");


        if (
            !email ||
            !password
        ) {

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        loginButton.disabled = true;

        loginButtonText.textContent =
            "Signing In...";


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email:
                    email,

                password:
                    password

            });


        if (error) {

            console.error(
                "Email login error:",
                error
            );


            loginButton.disabled = false;

            loginButtonText.textContent =
                "Sign In";


            showMessage(
                "Unable to sign in. Please check your email and password.",
                "error"
            );

            return;

        }


        console.log(
            "Email login successful.",
            data
        );


        window.location.replace(
            "./entrance.html"
        );

    }
);


/* =========================
   GOOGLE LOGIN
========================== */

googleButton.addEventListener(
    "click",
    async function () {

        googleButton.disabled = true;

        googleButtonText.textContent =
            "Connecting...";


        console.log(
            "Starting Google authentication..."
        );


        const redirectTo =
            window.location.origin +
            "/Journal-Archived-01/entrance.html";


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithOAuth({

                provider:
                    "google",

                options: {

                    redirectTo:
                        redirectTo

                }

            });


        if (error) {

            console.error(
                "Google login error:",
                error
            );


            googleButton.disabled = false;

            googleButtonText.textContent =
                "Continue with Google";


            showMessage(
                "Google login failed: " +
                error.message,
                "error"
            );

            return;

        }


        console.log(
            "Google authentication started.",
            data
        );

    }
);


/* =========================
   FORGOT PASSWORD
========================== */

forgotPassword.addEventListener(
    "click",
    function (event) {

        event.preventDefault();


        showMessage(
            "Password recovery will be available soon.",
            "error"
        );

    }
);


/* =========================
   AUTH STATE
========================== */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        console.log(
            "Login page auth event:",
            event
        );


        if (
            session &&
            session.user
        ) {

            window.location.replace(
                "./entrance.html"
            );

        }

    }
);


/* =========================
   START
========================== */

checkExistingSession();

</script>


</body>

</html>
