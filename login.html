<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"

    >

         SUPABASE
    ========================== -->

         FONTS
    ========================== -->

    <link

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #0b0c0d,
                    #181a1c 50%,
                    #292b2d
                );

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           BACKGROUND
        ========================== */

        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;
        }


        .background::before {

            content: "";

            position: absolute;

            width: 800px;
            height: 800px;

            top: -400px;
            right: -150px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.03) 40%,
                    transparent 70%
                );
        }


        /* =========================
           NAVIGATION
        ========================== */

        nav {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            width: 100%;

            height: 85px;

            padding: 0 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            color: #f0ece3;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            white-space: nowrap;
        }


        .links {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 32px;
        }


        .links a {

            color: #aaa9a3;

            text-decoration: none;

            font-size: 10px;

            letter-spacing: 0.14em;

            text-transform: uppercase;

            white-space: nowrap;

            transition:
                color 0.25s ease;
        }


        .links a:hover,
        .links .active {

            color: #eeeae1;
        }


        /* =========================
           LOGIN PAGE
        ========================== */

        main {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100vh;

            padding-top: 85px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login {

            width: 100%;

            max-width: 470px;

            padding:
                40px 25px 100px;

            text-align: center;
        }


        .eyebrow {

            margin-bottom: 24px;

            color: #777a7d;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        .login h1 {

            margin: 0;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    45px,
                    5.1vw,
                    68px
                );

            font-weight: 400;

            line-height: .95;

            letter-spacing: -0.05em;
        }


        .rule {

            width: 55px;

            height: 1px;

            margin:
                35px auto 25px;

            background:
                rgba(255,255,255,0.25);
        }


        .description {

            max-width: 330px;

            margin:
                0 auto 35px;

            color: #777a7d;

            font-size: 11px;

            line-height: 1.8;
        }


        /* =========================
           GOOGLE BUTTON
        ========================== */

        .google-button {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            max-width: 320px;

            margin: 0 auto;

            padding:
                14px 22px;

            border:
                1px solid
                rgba(255,255,255,0.20);

            background:
                rgba(255,255,255,0.03);

            color: #aaa9a3;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;
        }


        .google-button:hover {

            background:
                rgba(255,255,255,0.08);

            border-color:
                rgba(255,255,255,0.35);

            color: #eeeae1;
        }


        .google-button:disabled {

            opacity: 0.5;

            cursor: wait;
        }


        .google-icon {

            color: #eeeae1;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;

            font-weight: 500;
        }


        /* =========================
           NOTICE
        ========================== */

        .notice {

            margin-top: 25px;

            color: #5d5f62;

            font-size: 9px;

            line-height: 1.7;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            position: fixed;

            left: 7%;

            bottom: 28px;

            z-index: 6;

            color: #5d5f62;

            font-size: 9px;

            letter-spacing: 0.2em;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            html,
            body {

                width: 100%;

                min-height: 100%;

                height: auto;

                overflow-x: hidden;

                overflow-y: auto;
            }


            nav {

                position: relative;

                top: auto;
                left: auto;
                right: auto;

                width: 100%;

                height: auto;

                padding:
                    22px 20px 18px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: flex-start;

                gap: 18px;

                background:
                    rgba(11,12,13,0.97);

                backdrop-filter:
                    blur(10px);

                -webkit-backdrop-filter:
                    blur(10px);
            }


            .logo {

                width: 100%;

                text-align: center;

                font-size: 11px;

                line-height: 1.4;
            }


            .links {

                width: 100%;

                display: flex;

                flex-wrap: wrap;

                align-items: center;

                justify-content: center;

                gap:
                    12px 18px;
            }


            .links a {

                display: inline-block;

                padding:
                    3px 0;

                font-size: 9px;

                line-height: 1.5;
            }


            main {

                width: 100%;

                height: auto;

                min-height:
                    calc(100vh - 110px);

                padding-top: 0;

            }


            .login {

                width: 100%;

                max-width: 470px;

                padding:
                    55px 25px 90px;
            }


            .login h1 {

                max-width: 100%;

                font-size:
                    clamp(
                        46px,
                        13vw,
                        64px
                    );

                line-height: 0.98;
            }


            .description {

                max-width: 290px;

                font-size: 12px;
            }


            .google-button {

                max-width: 320px;

                padding:
                    14px 20px;

                font-size: 9px;
            }


            .notice {

                font-size: 8px;
            }


            footer {

                position: relative;

                left: auto;

                bottom: auto;

                width: 100%;

                padding:
                    0 25px 30px;

                text-align: center;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================== */

        @media (max-width: 430px) {

            nav {

                padding:
                    20px 15px 16px;

                gap: 16px;
            }


            .logo {

                font-size: 10px;
            }


            .links {

                gap:
                    10px 15px;
            }


            .links a {

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            main {

                min-height:
                    calc(100vh - 105px);
            }


            .login {

                padding:
                    45px 20px 70px;
            }


            .login h1 {

                font-size:
                    clamp(
                        42px,
                        13vw,
                        58px
                    );
            }


            .eyebrow {

                font-size: 8px;
            }


            .description {

                font-size: 11px;
            }


            .google-button {

                font-size: 8px;

                padding:
                    13px 18px;
            }


            .notice {

                font-size: 8px;
            }

        }

    </style>

</head>

<!-- =========================
     SUPABASE GOOGLE LOGIN
========================== -->

<script>

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {

                persistSession: true,

                autoRefreshToken: true,

                detectSessionInUrl: true,

                flowType: "pkce"

            }
        }
    );


const googleButton =
    document.getElementById(
        "google-login"
    );


const googleButtonText =
    document.getElementById(
        "google-login-text"
    );


/* =================================================
   GOOGLE LOGIN
================================================= */

googleButton.addEventListener(
    "click",
    async function () {

        googleButton.disabled = true;

        googleButtonText.textContent =
            "Connecting...";


        console.log(
            "Starting Google authentication..."
        );


        const redirectTo =
            window.location.origin +
            "/Journal-Archived-01/login.html";


        console.log(
            "OAuth callback:",
            redirectTo
        );


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithOAuth({

                provider: "google",

                options: {

                    redirectTo:
                        redirectTo,

                    queryParams: {

                        access_type: "offline",

                        prompt: "select_account"

                    }

                }

            });


        if (error) {

            console.error(
                "Google login error:",
                error
            );


            googleButton.disabled = false;

            googleButtonText.textContent =
                "Continue with Google";


            alert(
                "Login failed: " +
                error.message
            );

            return;

        }


        console.log(
            "Google OAuth started:",
            data
        );

    }
);


/* =================================================
   HANDLE RETURN FROM GOOGLE
================================================= */

async function handleOAuthCallback() {

    console.log(
        "Checking for OAuth callback..."
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            return;

        }


        const session =
            data?.session;


        if (
            session &&
            session.user
        ) {

            console.log(
                "SUCCESS: Supabase session established."
            );


            console.log(
                "Authenticated email:",
                session.user.email
            );


            console.log(
                "User metadata:",
                session.user.user_metadata
            );


            /*
             * The session now exists.
             *
             * Send the user to entrance.html.
             */

            window.location.replace(
                "./entrance.html"
            );

            return;

        }


        console.log(
            "No session found on this page."
        );

    }

    catch (error) {

        console.error(
            "OAuth callback error:",
            error
        );

    }

}


/* =================================================
   AUTH STATE LISTENER
================================================= */

supabaseClient.auth.onAuthStateChange(

    function (
        event,
        session
    ) {

        console.log(
            "Supabase authentication event:",
            event
        );


        if (
            event === "SIGNED_IN" &&
            session &&
            session.user
        ) {

            console.log(
                "SIGNED_IN successfully."
            );


            console.log(
                "User:",
                session.user
            );


            /*
             * Give Supabase a moment to
             * persist the session before
             * navigating away.
             */

            setTimeout(
                function () {

                    window.location.replace(
                        "./entrance.html"
                    );

                },
                300
            );

        }

    }

);


/* =================================================
   START
================================================= */

handleOAuthCallback();

</script>
