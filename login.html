
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JhoneVic's Diary</title>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #0b0c0d,
                    #181a1c 50%,
                    #292b2d
                );

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           BACKGROUND
        ========================== */

        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;
        }


        .background::before {

            content: "";

            position: absolute;

            width: 800px;
            height: 800px;

            top: -400px;
            right: -150px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.03) 40%,
                    transparent 70%
                );
        }


        /* =========================
           NAVIGATION
           EXACT INTRODUCTION LAYOUT
        ========================== */

        nav {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            width: 100%;

            height: 85px;

            padding: 0 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            color: #f0ece3;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            white-space: nowrap;
        }


        .links {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 32px;
        }


        .links a {

            color: #aaa9a3;

            text-decoration: none;

            font-size: 10px;

            letter-spacing: 0.14em;

            text-transform: uppercase;

            white-space: nowrap;

            transition:
                color 0.25s ease;
        }


        .links a:hover,
        .links .active {

            color: #eeeae1;
        }


        /* =========================
           LOGIN PAGE
        ========================== */

        main {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100vh;

            padding-top: 85px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login {

            width: 100%;

            max-width: 470px;

            padding:
                40px 25px 100px;

            text-align: center;
        }


        .eyebrow {

            margin-bottom: 24px;

            color: #777a7d;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        .login h1 {

            margin: 0;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    45px,
                    5.1vw,
                    68px
                );

            font-weight: 400;

            line-height: .95;

            letter-spacing: -0.05em;
        }


        .rule {

            width: 55px;

            height: 1px;

            margin:
                35px auto 25px;

            background:
                rgba(255,255,255,0.25);
        }


        .description {

            max-width: 330px;

            margin:
                0 auto 35px;

            color: #777a7d;

            font-size: 11px;

            line-height: 1.8;
        }


        /* =========================
           GOOGLE BUTTON
        ========================== */

        .google-button {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            max-width: 320px;

            margin: 0 auto;

            padding:
                14px 22px;

            border:
                1px solid
                rgba(255,255,255,0.20);

            background:
                rgba(255,255,255,0.03);

            color: #aaa9a3;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;
        }


        .google-button:hover {

            background:
                rgba(255,255,255,0.08);

            border-color:
                rgba(255,255,255,0.35);

            color: #eeeae1;
        }


        .google-icon {

            color: #eeeae1;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;

            font-weight: 500;
        }


        /* =========================
           NOTICE
        ========================== */

        .notice {

            margin-top: 25px;

            color: #5d5f62;

            font-size: 9px;

            line-height: 1.7;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            position: fixed;

            left: 7%;

            bottom: 28px;

            z-index: 6;

            color: #5d5f62;

            font-size: 9px;

            letter-spacing: 0.2em;

            text-transform: uppercase;
        }


        /* =================================================
           MOBILE
           EXACT INTRODUCTION NAVIGATION BEHAVIOR
        ================================================= */

        @media (max-width: 800px) {

            html,
            body {

                width: 100%;

                min-height: 100%;

                height: auto;

                overflow-x: hidden;

                overflow-y: auto;
            }


            body {

                background:
                    linear-gradient(
                        135deg,
                        #0b0c0d,
                        #181a1c 50%,
                        #292b2d
                    );
            }


            /* =========================
               MOBILE NAVIGATION
               SAME AS INTRODUCTION
            ========================== */

            nav {

                position: relative;

                top: auto;
                left: auto;
                right: auto;

                width: 100%;

                min-height: auto;

                height: auto;

                padding:
                    22px 20px 18px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: flex-start;

                gap: 18px;

                background:
                    rgba(11,12,13,0.97);

                backdrop-filter:
                    blur(10px);

                -webkit-backdrop-filter:
                    blur(10px);
            }


            .logo {

                width: 100%;

                padding: 0;

                text-align: center;

                font-size: 11px;

                line-height: 1.4;

                letter-spacing: 0.18em;
            }


            .links {

                width: 100%;

                display: flex;

                flex-wrap: wrap;

                align-items: center;

                justify-content: center;

                gap:
                    12px 18px;
            }


            .links a {

                display: inline-block;

                padding:
                    3px 0;

                font-size: 9px;

                line-height: 1.5;

                letter-spacing: 0.12em;

                white-space: nowrap;
            }


            /* =========================
               MOBILE LOGIN
            ========================== */

            main {

                width: 100%;

                height: auto;

                min-height:
                    calc(100vh - 110px);

                padding-top: 0;

                display: flex;

                align-items: center;

                justify-content: center;
            }


            .login {

                width: 100%;

                max-width: 470px;

                padding:
                    55px 25px 90px;
            }


            .login h1 {

                max-width: 100%;

                font-size:
                    clamp(
                        46px,
                        13vw,
                        64px
                    );

                line-height: 0.98;

                letter-spacing: -0.045em;

                word-break: normal;

                overflow-wrap: normal;
            }


            .eyebrow {

                margin-bottom: 20px;

                font-size: 9px;

                letter-spacing: 0.25em;
            }


            .description {

                max-width: 290px;

                margin:
                    0 auto 30px;

                font-size: 12px;

                line-height: 1.8;
            }


            .google-button {

                width: 100%;

                max-width: 320px;

                padding:
                    14px 20px;

                font-size: 9px;

                line-height: 1.5;
            }


            .notice {

                font-size: 8px;

                line-height: 1.7;
            }


            /* =========================
               MOBILE FOOTER
            ========================== */

            footer {

                position: relative;

                left: auto;

                bottom: auto;

                width: 100%;

                padding:
                    0 25px 30px;

                font-size: 8px;

                line-height: 1.5;

                text-align: center;
            }

        }


        /* =================================================
           VERY SMALL PHONES
           SAME INTRODUCTION BREAKPOINT
        ================================================= */

        @media (max-width: 430px) {

            nav {

                padding:
                    20px 15px 16px;

                gap: 16px;
            }


            .logo {

                font-size: 10px;
            }


            .links {

                gap:
                    10px 15px;
            }


            .links a {

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            main {

                min-height:
                    calc(100vh - 105px);
            }


            .login {

                padding:
                    45px 20px 70px;
            }


            .login h1 {

                font-size:
                    clamp(
                        42px,
                        13vw,
                        58px
                    );
            }


            .eyebrow {

                font-size: 8px;
            }


            .description {

                font-size: 11px;
            }


            .google-button {

                font-size: 8px;

                padding:
                    13px 18px;
            }


            .notice {

                font-size: 8px;
            }

        }

    </style>

</head>


<body>


<div class="background"></div>


<!-- =========================
     NAVIGATION
========================== -->

<nav>

    <div class="logo">

        JhoneVic's Diary

    </div>


    <div class="links">


        <!-- HOME -->

        <a href="./index.html">

            Home

        </a>


        <!-- INTRODUCTION -->

        <a href="./introduction.html">

            Introduction

        </a>


        <!-- REFLECTIONS -->

        <a href="./reflections.html">

            Reflection | Photographs

        </a>


        <!-- TIMELINE -->

        <a href="./timeline.html">

            Timeline

        </a>


        <!-- LOGIN -->

        <a
            href="./login.html"
            class="active"
        >

            Login

        </a>


    </div>

</nav>


<!-- =========================
     LOGIN
========================== -->

<main>

    <section class="login">


        <div class="eyebrow">

            The Archive

        </div>


        <h1>

            The Unspoken<br>
            Chapters

        </h1>


        <div class="rule"></div>


        <p class="description">

            Enter the archive with your
            Google account.

        </p>


        <button
            type="button"
            class="google-button"
            id="google-login"
        >

            <span class="google-icon">

                G

            </span>

            <span>

                Continue with Google

            </span>

        </button>


        <p class="notice">

            Access is restricted to
            authorized readers.

        </p>


    </section>

</main>


<footer>

    Personal Archive · 2013—2026

</footer>


<!-- =========================
     SUPABASE GOOGLE LOGIN
========================== -->

<script>

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document
    .getElementById("google-login")
    .addEventListener(
        "click",
        async function () {

            const { error } =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            window.location.origin +
                            "/Journal-Archived-01/index.html"

                    }

                });


            if (error) {

                console.error(error);

                alert(
                    "Login failed: " +
                    error.message
                );

            }

        }
    );

</script>


</body>

</html>
