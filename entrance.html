<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        The Unspoken Chapters | JhoneVic's Diary
    </title>

    <meta
        name="description"
        content="The entrance to The Unspoken Chapters, a personal diary archive."
    >


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background: #0b0c0d;

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           ENTRANCE
        ========================== */

        .entrance {

            position: relative;

            width: 100%;

            height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            padding:
                0 8% 200px;

            background:

                linear-gradient(
                    to top,
                    rgba(0,0,0,0.94),
                    rgba(0,0,0,0.35) 55%,
                    rgba(0,0,0,0.05)
                ),

                radial-gradient(
                    circle at 72% 18%,
                    #3a3c3e,
                    #202224 35%,
                    #0b0c0d 72%
                );
        }


        /* =========================
           SUBTLE LIGHT
        ========================== */

        .entrance::before {

            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            top: -420px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.03) 45%,
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================
           GOOGLE USER NAME
        ========================== */

        .user-name {

            position: absolute;

            top: 32px;

            right: 8%;

            z-index: 5;

            color: #eeeae1;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.4s ease;
        }


        .user-name.visible {

            opacity: 1;
        }


        /* =========================
           CONTENT
        ========================== */

        .entrance-content {

            position: relative;

            z-index: 2;

            max-width: 700px;
        }


        .archive-label {

            margin-bottom: 18px;

            color: #aaa9a3;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        h1 {

            margin:
                0 0 38px;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    52px,
                    8vw,
                    90px
                );

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -0.06em;
        }


        /* =========================
           2013 BUTTON
        ========================== */

        .year-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 145px;

            padding:
                14px 32px;

            border:
                1px solid
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.035);

            color: #eeeae1;

            text-decoration: none;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .year-button:hover {

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.65);

            transform:
                translateY(-2px);
        }


        .year-button:active {

            transform:
                translateY(0);
        }


        /* =========================
           SMALL ARCHIVE MARK
        ========================== */

        .archive-mark {

            position: absolute;

            right: 8%;

            bottom: 72px;

            z-index: 2;

            color: #5d5f62;

            font-size: 8px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            writing-mode:
                vertical-rl;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            html,
            body {

                height: 100%;

                overflow: hidden;
            }


            .entrance {

                height: 100vh;

                min-height: 100vh;

                padding:
                    0 25px 70px;

                align-items: flex-end;
            }


            .user-name {

                top: 22px;

                right: 25px;

                max-width: 65%;

                overflow: hidden;

                text-overflow: ellipsis;

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            .entrance-content {

                width: 100%;

                max-width: 100%;
            }


            .archive-label {

                margin-bottom: 16px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            h1 {

                margin-bottom: 32px;

                max-width: 360px;

                font-size:
                    clamp(
                        48px,
                        14vw,
                        70px
                    );

                line-height: 0.92;

                letter-spacing: -0.055em;
            }


            .year-button {

                min-width: 130px;

                padding:
                    13px 27px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            .archive-mark {

                right: 20px;

                bottom: 55px;

                font-size: 7px;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 430px) {

            .entrance {

                padding:
                    0 20px 70px;
            }


            .user-name {

                top: 19px;

                right: 20px;

                font-size: 7px;
            }


            .archive-label {

                font-size: 7px;
            }


            h1 {

                font-size:
                    clamp(
                        44px,
                        14vw,
                        60px
                    );

                margin-bottom: 28px;
            }


            .year-button {

                min-width: 120px;

                padding:
                    12px 24px;

                font-size: 8px;
            }


            .archive-mark {

                right: 15px;

                bottom: 45px;
            }

        }

    </style>

</head>


<body>


<main class="entrance">


    <!-- =========================
         GOOGLE USER NAME
    ========================== -->

    <div
        class="user-name"
        id="user-name"
    ></div>


    <div class="entrance-content">


        <div class="archive-label">

            Personal Archive

        </div>


        <h1>

            The Unspoken<br>
            Chapters

        </h1>


        <a
            class="year-button"
            href="./2013.html"
        >

            2013

        </a>


    </div>


    <div class="archive-mark">

        JhoneVic's Diary

    </div>


</main>


<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

/* =================================================
   SUPABASE CONFIGURATION
================================================= */

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


/* =================================================
   CREATE SUPABASE CLIENT
================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {

                persistSession: true,

                autoRefreshToken: true,

                detectSessionInUrl: true

            }
        }
    );


/* =================================================
   ELEMENTS
================================================= */

const userNameElement =
    document.getElementById(
        "user-name"
    );


/* =================================================
   LOGIN PAGE
================================================= */

const LOGIN_PAGE =
    "./login.html";


/* =================================================
   REDIRECT TO LOGIN
================================================= */

function redirectToLogin() {

    console.log(
        "No authenticated session."
    );


    console.log(
        "Redirecting to login..."
    );


    /*
     * replace() is intentional.
     *
     * It prevents the protected
     * entrance page from remaining
     * in the browser history.
     */

    window.location.replace(
        LOGIN_PAGE
    );

}


/* =================================================
   DISPLAY USER NAME
================================================= */

function displayUserName(user) {

    if (
        !user ||
        !userNameElement
    ) {

        return;

    }


    console.log(
        "Authenticated user:",
        user
    );


    const metadata =
        user.user_metadata || {};


    /*
     * Google normally provides
     * the user's name here.
     */

    const fullName =
        metadata.full_name ||
        metadata.name ||
        metadata.display_name ||
        metadata.displayName ||
        "";


    if (fullName) {

        userNameElement.textContent =
            fullName;


        userNameElement.classList.add(
            "visible"
        );


        return;

    }


    /*
     * Fallback to Google identity data.
     */

    const identities =
        user.identities || [];


    for (
        let i = 0;
        i < identities.length;
        i++
    ) {

        const identity =
            identities[i];


        const identityData =
            identity.identity_data || {};


        const identityName =
            identityData.full_name ||
            identityData.name ||
            identityData.display_name ||
            identityData.displayName ||
            "";


        if (identityName) {

            userNameElement.textContent =
                identityName;


            userNameElement.classList.add(
                "visible"
            );


            return;

        }

    }

}


/* =================================================
   HANDLE AUTHENTICATED SESSION
================================================= */

function handleSession(session) {

    /*
     * No session means the visitor
     * is NOT authorized.
     */

    if (
        !session ||
        !session.user
    ) {

        redirectToLogin();

        return false;

    }


    /*
     * A valid authenticated session
     * has been found.
     */

    console.log(
        "Authenticated session confirmed."
    );


    console.log(
        "User ID:",
        session.user.id
    );


    displayUserName(
        session.user
    );


    return true;

}


/* =================================================
   AUTH STATE LISTENER
================================================= */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        console.log(
            "Supabase auth event:",
            event
        );


        /* -----------------------------------------
           INITIAL SESSION
        ----------------------------------------- */

        if (
            event === "INITIAL_SESSION"
        ) {

            if (session) {

                handleSession(
                    session
                );

            } else {

                redirectToLogin();

            }

            return;

        }


        /* -----------------------------------------
           SIGNED IN
        ----------------------------------------- */

        if (
            event === "SIGNED_IN"
        ) {

            if (session) {

                handleSession(
                    session
                );

            }

            return;

        }


        /* -----------------------------------------
           SIGNED OUT
        ----------------------------------------- */

        if (
            event === "SIGNED_OUT"
        ) {

            console.log(
                "User signed out."
            );


            redirectToLogin();


            return;

        }


        /* -----------------------------------------
           TOKEN REFRESHED
        ----------------------------------------- */

        if (
            event === "TOKEN_REFRESHED"
        ) {

            if (session) {

                handleSession(
                    session
                );

            } else {

                redirectToLogin();

            }

            return;

        }

    }
);


/* =================================================
   INITIAL AUTHENTICATION CHECK
================================================= */

async function initializeEntrance() {

    console.log(
        "Checking authentication..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    /* -----------------------------------------
       SESSION CHECK ERROR
    ----------------------------------------- */

    if (error) {

        console.error(
            "Supabase session error:",
            error
        );


        /*
         * If the session cannot be verified,
         * do not allow access.
         */

        redirectToLogin();


        return;

    }


    /* -----------------------------------------
       VALID SESSION
    ----------------------------------------- */

    if (
        data &&
        data.session &&
        data.session.user
    ) {

        console.log(
            "Valid session found."
        );


        handleSession(
            data.session
        );


        return;

    }


    /* -----------------------------------------
       NO SESSION
    ----------------------------------------- */

    console.log(
        "No authenticated session found."
    );


    redirectToLogin();

}


/* =================================================
   START
================================================= */

initializeEntrance();

</script>


</body>

</html>
