
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        The Unspoken Chapters | JhoneVic's Diary
    </title>

    <meta
        name="description"
        content="The entrance to The Unspoken Chapters, a personal diary archive."
    >


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background: #0b0c0d;

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           ENTRANCE
        ========================== */

        .entrance {

            position: relative;

            width: 100%;

            height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            padding:
                0 8% 70px;

            background:

                linear-gradient(
                    to top,
                    rgba(0,0,0,0.94),
                    rgba(0,0,0,0.35) 55%,
                    rgba(0,0,0,0.05)
                ),

                radial-gradient(
                    circle at 72% 18%,
                    #3a3c3e,
                    #202224 35%,
                    #0b0c0d 72%
                );
        }


        /* =========================
           SUBTLE LIGHT
        ========================== */

        .entrance::before {

            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            top: -420px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.03) 45%,
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================
           GOOGLE USER NAME
        ========================== */

        .user-name {

            position: absolute;

            top: 32px;

            right: 8%;

            z-index: 5;

            color: #aaa9a3;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.4s ease;
        }


        .user-name.visible {

            opacity: 1;
        }


        /* =========================
           CONTENT
        ========================== */

        .entrance-content {

            position: relative;

            z-index: 2;

            max-width: 700px;
        }


        .archive-label {

            margin-bottom: 18px;

            color: #aaa9a3;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        h1 {

            margin:
                0 0 38px;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    52px,
                    8vw,
                    90px
                );

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -0.06em;
        }


        /* =========================
           2013 BUTTON
        ========================== */

        .year-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 145px;

            padding:
                14px 32px;

            border:
                1px solid
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.035);

            color: #eeeae1;

            text-decoration: none;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .year-button:hover {

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.65);

            transform:
                translateY(-2px);
        }


        .year-button:active {

            transform:
                translateY(0);
        }


        /* =========================
           SMALL ARCHIVE MARK
        ========================== */

        .archive-mark {

            position: absolute;

            right: 8%;

            bottom: 72px;

            z-index: 2;

            color: #5d5f62;

            font-size: 8px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            writing-mode:
                vertical-rl;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            html,
            body {

                height: 100%;

                overflow: hidden;
            }


            .entrance {

                height: 100vh;

                min-height: 100vh;

                padding:
                    0 25px 70px;

                align-items: flex-end;

                background:

                    linear-gradient(
                        to top,
                        rgba(0,0,0,0.96),
                        rgba(0,0,0,0.42) 60%,
                        rgba(0,0,0,0.08)
                    ),

                    radial-gradient(
                        circle at 75% 15%,
                        #353739,
                        #1b1d1f 38%,
                        #0b0c0d 75%
                    );
            }


            /* =========================
               MOBILE USER NAME
            ========================== */

            .user-name {

                top: 22px;

                right: 25px;

                max-width: 65%;

                overflow: hidden;

                text-overflow: ellipsis;

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            .entrance-content {

                width: 100%;

                max-width: 100%;
            }


            .archive-label {

                margin-bottom: 16px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            h1 {

                margin-bottom: 32px;

                max-width: 360px;

                font-size:
                    clamp(
                        48px,
                        14vw,
                        70px
                    );

                line-height: 0.92;

                letter-spacing: -0.055em;
            }


            .year-button {

                min-width: 130px;

                padding:
                    13px 27px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            .archive-mark {

                right: 20px;

                bottom: 55px;

                font-size: 7px;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 430px) {

            .entrance {

                padding:
                    0 20px 70px;
            }


            .user-name {

                top: 19px;

                right: 20px;

                font-size: 7px;
            }


            .archive-label {

                font-size: 7px;
            }


            h1 {

                font-size:
                    clamp(
                        44px,
                        14vw,
                        60px
                    );

                margin-bottom: 28px;
            }


            .year-button {

                min-width: 120px;

                padding:
                    12px 24px;

                font-size: 8px;
            }


            .archive-mark {

                right: 15px;

                bottom: 45px;
            }

        }

    </style>

</head>


<body>


<main class="entrance">


    <!-- =========================
         GOOGLE USER NAME
    ========================== -->

    <div
        class="user-name"
        id="user-name"
    ></div>


    <div class="entrance-content">


        <div class="archive-label">

            Personal Archive

        </div>


        <h1>

            The Unspoken<br>
            Chapters

        </h1>


        <a
            class="year-button"
            href="./2013.html"
        >

            2013

        </a>


    </div>


    <div class="archive-mark">

        JhoneVic's Diary

    </div>


</main>


<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   LOAD AUTHENTICATED USER
========================== */

async function loadAuthenticatedUser() {

    const userNameElement =
        document.getElementById("user-name");


    /*
     * First ask Supabase for the
     * currently restored session.
     */

    const {
        data: {
            session
        },
        error
    } =
        await supabaseClient.auth.getSession();


    /*
     * If there is a real authentication
     * error, return to login.
     */

    if (error) {

        console.error(
            "Supabase session error:",
            error
        );

        window.location.href =
            "./login.html";

        return;

    }


    /*
     * If the OAuth session has not
     * finished restoring yet, wait for
     * the authentication state event.
     */

    if (!session) {

        const {
            data: {
                subscription
            }
        } =
            supabaseClient.auth.onAuthStateChange(
                async function (
                    event,
                    newSession
                ) {

                    if (
                        newSession &&
                        newSession.user
                    ) {

                        subscription.unsubscribe();

                        displayUserName(
                            newSession.user
                        );

                    }

                }
            );


        /*
         * Give Supabase a short amount
         * of time to restore the session.
         */

        setTimeout(
            async function () {

                const {
                    data: {
                        session: currentSession
                    }
                } =
                    await supabaseClient.auth.getSession();


                if (
                    currentSession &&
                    currentSession.user
                ) {

                    subscription.unsubscribe();

                    displayUserName(
                        currentSession.user
                    );

                    return;

                }


                /*
                 * No authenticated session
                 * was found.
                 */

                subscription.unsubscribe();

                window.location.href =
                    "./login.html";

            },
            2500
        );


        return;

    }


    /*
     * Session already exists.
     */

    displayUserName(
        session.user
    );

}


/* =========================
   DISPLAY GOOGLE FULL NAME
========================== */

function displayUserName(user) {

    const userNameElement =
        document.getElementById("user-name");


    /*
     * Google normally provides
     * full_name in user_metadata.
     */

    const fullName =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "";


    /*
     * If no name was supplied,
     * don't display an incorrect
     * fallback.
     */

    if (!fullName) {

        console.warn(
            "Google full name was not provided."
        );

        return;

    }


    userNameElement.textContent =
        fullName;


    userNameElement.classList.add(
        "visible"
    );

}


/* =========================
   START
========================== */

loadAuthenticatedUser();

</script>


</body>

</html>
