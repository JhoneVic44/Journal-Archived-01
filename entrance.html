<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        The Unspoken Chapters | JhoneVic's Diary
    </title>

    <meta
        name="description"
        content="The entrance to The Unspoken Chapters, a personal diary archive."
    >

    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background: #0b0c0d;

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           ENTRANCE
        ========================== */

        .entrance {

            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            padding:
                0 8% clamp(80px, 14vh, 200px);

            background:

                linear-gradient(
                    to top,
                    rgba(0,0,0,0.94),
                    rgba(0,0,0,0.35) 55%,
                    rgba(0,0,0,0.05)
                ),

                radial-gradient(
                    circle at 72% 18%,
                    #3a3c3e,
                    #202224 35%,
                    #0b0c0d 72%
                );
        }


        /* =========================
           SUBTLE LIGHT
        ========================== */

        .entrance::before {

            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            top: -420px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.03) 45%,
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================
           TOP RIGHT USER
        ========================== */

        .top-actions {

            position: absolute;

            top: 28px;
            right: 8%;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: flex-end;
        }


        .user-name {

            color: #eeeae1;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.4s ease;
        }


        .user-name.visible {

            opacity: 1;
        }


        /* =========================
           CONTENT
        ========================== */

        .entrance-content {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 700px;
        }


        .archive-label {

            margin-bottom: 18px;

            color: #aaa9a3;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        h1 {

            margin:
                0 0 38px;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    52px,
                    8vw,
                    90px
                );

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -0.06em;
        }


        /* =========================
           2013 BUTTON
        ========================== */

        .year-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 145px;

            padding:
                14px 32px;

            border:
                1px solid
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.035);

            color: #eeeae1;

            text-decoration: none;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .year-button:hover {

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.65);

            transform:
                translateY(-2px);
        }


        .year-button:active {

            transform:
                translateY(0);
        }


        /* =========================
           SMALL ARCHIVE MARK
        ========================== */

        .archive-mark {

            position: absolute;

            right: 8%;

            bottom: 72px;

            z-index: 2;

            color: #5d5f62;

            font-size: 8px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            writing-mode:
                vertical-rl;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            html,
            body {

                width: 100%;
                height: 100%;

                overflow: hidden;
            }


            .entrance {

                width: 100%;

                height: 100vh;
                height: 100dvh;

                min-height: 0;

                padding:
                    0 25px 70px;

                align-items: flex-end;
            }


            .top-actions {

                top: 20px;

                right: 25px;

                max-width: 72%;
            }


            .user-name {

                max-width: 150px;

                overflow: hidden;

                text-overflow: ellipsis;

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            .entrance-content {

                width: 100%;

                max-width: 100%;
            }


            .archive-label {

                margin-bottom: 16px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            h1 {

                margin-bottom: 32px;

                max-width: 360px;

                font-size:
                    clamp(
                        48px,
                        14vw,
                        70px
                    );

                line-height: 0.92;

                letter-spacing: -0.055em;
            }


            .year-button {

                min-width: 130px;

                padding:
                    13px 27px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            .archive-mark {

                right: 20px;

                bottom: 55px;

                font-size: 7px;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 430px) {

            .entrance {

                padding:
                    0 20px 65px;
            }


            .top-actions {

                top: 17px;

                right: 20px;
            }


            .user-name {

                max-width: 120px;

                font-size: 7px;
            }


            .archive-label {

                font-size: 7px;
            }


            h1 {

                font-size:
                    clamp(
                        44px,
                        14vw,
                        60px
                    );

                margin-bottom: 28px;
            }


            .year-button {

                min-width: 120px;

                padding:
                    12px 24px;

                font-size: 8px;
            }


            .archive-mark {

                right: 15px;

                bottom: 45px;
            }

        }


        /* =================================================
           SHORT DESKTOP SCREENS
        ================================================= */

        @media (min-width: 801px) and (max-height: 700px) {

            .entrance {

                padding-bottom: 80px;
            }


            h1 {

                margin-bottom: 28px;

                font-size:
                    clamp(
                        48px,
                        7vw,
                        72px
                    );
            }


            .archive-mark {

                bottom: 40px;
            }

        }

    </style>

</head>


<body>


<main class="entrance">


    <!-- =========================
         TOP RIGHT USER
    ========================== -->

    <div
        class="top-actions"
        id="topActions"
    >

        <div
            class="user-name"
            id="user-name"
        ></div>

    </div>


    <!-- =========================
         CONTENT
    ========================== -->

    <div class="entrance-content">


        <div class="archive-label">

            Personal Archive

        </div>


        <h1>

            The Unspoken<br>
            Chapters

        </h1>


        <a
            class="year-button"
            href="./2013.html"
            id="yearButton"
        >

            2013

        </a>


    </div>


    <div class="archive-mark">

        JhoneVic's Diary

    </div>


</main>


<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

/* =================================================
   SUPABASE CONFIGURATION
================================================= */

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


/* =================================================
   CREATE SUPABASE CLIENT
================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {

                persistSession: true,

                autoRefreshToken: true,

                detectSessionInUrl: true,

                storage:
                    window.localStorage

            }
        }
    );


/* =================================================
   ELEMENT
================================================= */

const userNameElement =
    document.getElementById(
        "user-name"
    );


/* =================================================
   DISPLAY USER NAME
================================================= */

function displayUserName(user) {

    if (
        !user ||
        !userNameElement
    ) {

        return;

    }


    const metadata =
        user.user_metadata || {};


    let fullName =
        metadata.full_name ||
        metadata.name ||
        metadata.display_name ||
        metadata.displayName ||
        "";


    /*
     * Fallback to identity information.
     */

    if (!fullName) {

        const identities =
            user.identities || [];


        for (
            const identity of identities
        ) {

            const identityData =
                identity.identity_data || {};


            fullName =
                identityData.full_name ||
                identityData.name ||
                identityData.display_name ||
                identityData.displayName ||
                "";


            if (fullName) {

                break;

            }

        }

    }


    /*
     * Final fallback.
     */

    if (!fullName && user.email) {

        fullName =
            user.email.split("@")[0];

    }


    if (fullName) {

        userNameElement.textContent =
            fullName;

        userNameElement.classList.add(
            "visible"
        );

    }

}


/* =================================================
   SHOW AUTHENTICATED PAGE
================================================= */

function showAuthenticatedPage(session) {

    if (
        !session ||
        !session.user
    ) {

        return;

    }


    displayUserName(
        session.user
    );


    console.log(
        "AUTHENTICATED USER:",
        session.user.id
    );

}


/* =================================================
   AUTH STATE
================================================= */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        console.log(
            "SUPABASE AUTH EVENT:",
            event
        );


        console.log(
            "SUPABASE SESSION:",
            session
        );


        if (
            session &&
            session.user
        ) {

            showAuthenticatedPage(
                session
            );

        }

    }
);


/* =================================================
   VERIFY SESSION
================================================= */

async function verifySession() {

    console.log(
        "Checking authenticated session..."
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session verification error:",
                error
            );

            return;

        }


        if (
            data &&
            data.session &&
            data.session.user
        ) {

            console.log(
                "Authenticated session confirmed."
            );


            showAuthenticatedPage(
                data.session
            );


        } else {

            console.warn(
                "No authenticated session found."
            );

        }

    } catch (error) {

        console.error(
            "Unexpected authentication error:",
            error
        );

    }

}


/* =================================================
   START
================================================= */

verifySession();

</script>


</body>

</html>
