<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unspoken Chapters | JhoneVic's Diary</title>

    <meta name="description" content="The entrance to The Unspoken Chapters, a personal diary archive.">

    <!-- =========================
         FONTS
    ========================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #0b0c0d;
            color: #eeeae1;
            font-family: "Manrope", Arial, sans-serif;
        }

        .entrance {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.94), rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.05)),
                        radial-gradient(circle at 72% 18%, #3a3c3e, #202224 35%, #0b0c0d 72%);
        }

        .entrance::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,.04), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .content {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 8%;
        }

        .archive-label {
            color: #aaa9a3;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 12px 0;
            color: #eeeae1;
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(44px, 6vw, 72px);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.06em;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255,215,0,.15);
            margin: 10px auto 20px auto;
        }

        .subtitle {
            color: #888;
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.6;
            margin: 0 auto 25px auto;
            max-width: 380px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
        }

        .year-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 130px;
            height: 46px;
            padding: 0 20px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.035);
            color: #eeeae1;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
            border-radius: 4px;
            margin: 0 auto;
            white-space: nowrap;
        }

        .year-button:hover {
            background: rgba(255,255,255,0.11);
            border-color: rgba(255,255,255,0.65);
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            html, body {
                overflow: hidden;
                height: 100%;
            }

            .entrance {
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 20px;
            }

            .entrance::after { display: none; }

            .content {
                max-width: 100%;
                padding: 0 5px;
                justify-content: center;
                height: 100%;
            }

            h1 {
                font-size: clamp(28px, 8vw, 38px);
                line-height: 0.95;
                margin-bottom: 8px;
            }

            .archive-label {
                font-size: 8px;
                margin-bottom: 12px;
                letter-spacing: 0.25em;
            }

            .subtitle {
                font-size: 13px;
                line-height: 1.5;
                margin-bottom: 18px;
                max-width: 100%;
                padding: 0 5px;
            }

            .divider {
                width: 30px;
                margin: 6px auto 14px auto;
            }

            .button-group {
                gap: 10px;
            }

            .year-button {
                min-width: 110px;
                height: 40px;
                padding: 0 16px;
                font-size: 8px;
                gap: 6px;
                letter-spacing: 0.2em;
            }
        }

        @media (max-width: 480px) {
            .entrance { padding: 15px; }

            h1 {
                font-size: clamp(24px, 8vw, 32px);
                margin-bottom: 6px;
            }

            .subtitle {
                font-size: 12px;
                margin-bottom: 14px;
                line-height: 1.4;
            }

            .button-group {
                gap: 8px;
            }

            .year-button {
                min-width: 100px;
                height: 36px;
                padding: 0 12px;
                font-size: 7px;
                gap: 5px;
                letter-spacing: 0.18em;
            }

            .archive-label {
                font-size: 7px;
                margin-bottom: 8px;
                letter-spacing: 0.2em;
            }

            .divider {
                width: 25px;
                margin: 4px auto 10px auto;
            }
        }

        @media (max-width: 380px) {
            .entrance { padding: 12px; }

            h1 {
                font-size: clamp(20px, 7vw, 26px);
                margin-bottom: 4px;
            }

            .subtitle {
                font-size: 11px;
                margin-bottom: 12px;
            }

            .button-group {
                gap: 6px;
            }

            .year-button {
                min-width: 90px;
                height: 32px;
                padding: 0 10px;
                font-size: 7px;
                gap: 4px;
                letter-spacing: 0.15em;
            }

            .archive-label {
                font-size: 6px;
                margin-bottom: 6px;
            }

            .divider {
                width: 20px;
                margin: 3px auto 8px auto;
            }
        }
    </style>
</head>
<body>
    <div class="entrance">
        <div class="content">
            <div class="archive-label">Personal Archive</div>
            <h1>The Unspoken<br>Chapters</h1>
            <div class="divider"></div>
            <p class="subtitle">A collection of personal diary entries from 2013 and 2014. Explore the past, one entry at a time.</p>
            <div class="button-group">
                <a class="year-button" href="./2013.html">2013</a>
                <a class="year-button" href="./2014.html">2014</a>
            </div>
        </div>
    </div>
</body>
</html>
