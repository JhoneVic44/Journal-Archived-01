    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background: #0b0c0d;

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           ENTRANCE
        ========================== */

        .entrance {

            position: relative;

            width: 100%;

            height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            padding:
                0 8% 400px;

            background:

                linear-gradient(
                    to top,
                    rgba(0,0,0,0.94),
                    rgba(0,0,0,0.35) 55%,
                    rgba(0,0,0,0.05)
                ),

                radial-gradient(
                    circle at 72% 18%,
                    #3a3c3e,
                    #202224 35%,
                    #0b0c0d 72%
                );
        }


        /* =========================
           SUBTLE LIGHT
        ========================== */

        .entrance::before {

            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            top: -420px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.03) 45%,
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================
           GOOGLE USER NAME
        ========================== */

        .user-name {

            position: absolute;

            top: 32px;

            right: 8%;

            z-index: 5;

            color: #eeeae1;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.4s ease;
        }


        .user-name.visible {

            opacity: 1;
        }


        /* =========================
           CONTENT
        ========================== */

        .entrance-content {

            position: relative;

            z-index: 2;

            max-width: 700px;
        }


        .archive-label {

            margin-bottom: 18px;

            color: #aaa9a3;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        h1 {

            margin:
                0 0 38px;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    52px,
                    8vw,
                    90px
                );

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -0.06em;
        }


        /* =========================
           2013 BUTTON
        ========================== */

        .year-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 145px;

            padding:
                14px 32px;

            border:
                1px solid
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.035);

            color: #eeeae1;

            text-decoration: none;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .year-button:hover {

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.65);

            transform:
                translateY(-2px);
        }


        .year-button:active {

            transform:
                translateY(0);
        }


        /* =========================
           SMALL ARCHIVE MARK
        ========================== */

        .archive-mark {

            position: absolute;

            right: 8%;

            bottom: 72px;

            z-index: 2;

            color: #5d5f62;

            font-size: 8px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            writing-mode:
                vertical-rl;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            html,
            body {

                height: 100%;

                overflow: hidden;
            }


            .entrance {

                height: 100vh;

                min-height: 100vh;

                padding:
                    0 25px 70px;

                align-items: flex-end;
            }


            .user-name {

                top: 22px;

                right: 25px;

                max-width: 65%;

                overflow: hidden;

                text-overflow: ellipsis;

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            .entrance-content {

                width: 100%;

                max-width: 100%;
            }


            .archive-label {

                margin-bottom: 16px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            h1 {

                margin-bottom: 32px;

                max-width: 360px;

                font-size:
                    clamp(
                        48px,
                        14vw,
                        70px
                    );

                line-height: 0.92;

                letter-spacing: -0.055em;
            }


            .year-button {

                min-width: 130px;

                padding:
                    13px 27px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            .archive-mark {

                right: 20px;

                bottom: 55px;

                font-size: 7px;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 430px) {

            .entrance {

                padding:
                    0 20px 70px;
            }


            .user-name {

                top: 19px;

                right: 20px;

                font-size: 7px;
            }


            .archive-label {

                font-size: 7px;
            }


            h1 {

                font-size:
                    clamp(
                        44px,
                        14vw,
                        60px
                    );

                margin-bottom: 28px;
            }


            .year-button {

                min-width: 120px;

                padding:
                    12px 24px;

                font-size: 8px;
            }


            .archive-mark {

                right: 15px;

                bottom: 45px;
            }

        }

    </style>

</head>


<body>


<main class="entrance">


    <!-- =========================
         GOOGLE USER NAME
    ========================== -->

    <div
        class="user-name"
        id="user-name"
    ></div>


    <div class="entrance-content">


        <div class="archive-label">

            Personal Archive

        </div>


        <h1>

            The Unspoken<br>
            Chapters

        <a
            class="year-button"
            href="./2013.html"
        >

            2013

        </a>


    </div>


    <div class="archive-mark">

        JhoneVic's Diary

    </div>


</main>


<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


/*
 * IMPORTANT:
 *
 * This client keeps the session in
 * browser storage and automatically
 * detects an OAuth callback.
 */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {

                persistSession: true,

                autoRefreshToken: true,

                detectSessionInUrl: true

            }
        }
    );


const userNameElement =
    document.getElementById(
        "user-name"
    );


/* =================================================
   DISPLAY USER NAME
================================================= */

function displayUserName(user) {

    if (
        !user ||
        !userNameElement
    ) {

        return;

    }


    console.log(
        "Supabase user:",
        user
    );


    console.log(
        "User metadata:",
        user.user_metadata
    );


    /*
     * Google normally places the
     * display name in one of these.
     */

    const metadata =
        user.user_metadata || {};


    const fullName =
        metadata.full_name ||
        metadata.name ||
        metadata.display_name ||
        metadata.displayName ||
        "";


    /*
     * If the name is available,
     * display it.
     */

    if (fullName) {

        userNameElement.textContent =
            fullName;


        userNameElement.classList.add(
            "visible"
        );


        console.log(
            "Displaying Google name:",
            fullName
        );


        return;

    }


    /*
     * If no name is available in
     * user_metadata, try the identity
     * information returned by Google.
     */

    const identities =
        user.identities || [];


    for (
        let i = 0;
        i < identities.length;
        i++
    ) {

        const identity =
            identities[i];


        const identityData =
            identity.identity_data || {};


        const identityName =
            identityData.full_name ||
            identityData.name ||
            identityData.display_name ||
            identityData.displayName ||
            "";


        if (identityName) {

            userNameElement.textContent =
                identityName;


            userNameElement.classList.add(
                "visible"
            );


            console.log(
                "Displaying Google identity name:",
                identityName
            );


            return;

        }

    }


    /*
     * Do not redirect just because
     * the name isn't available.
     */

    console.warn(
        "Authenticated user found, but no display name was available."
    );

}


/* =================================================
   HANDLE AUTHENTICATED USER
================================================= */

function handleAuthenticatedUser(
    session
) {

    if (
        !session ||
        !session.user
    ) {

        console.log(
            "No authenticated session yet."
        );

        return false;

    }


    console.log(
        "Authenticated session found:",
        session.user.id
    );


    displayUserName(
        session.user
    );


    return true;

}


/* =================================================
   AUTH STATE LISTENER
================================================= */

const {
    data: {
        subscription
    }
} =
    supabaseClient.auth.onAuthStateChange(
        function (
            event,
            session
        ) {

            console.log(
                "Supabase authentication event:",
                event
            );


            /*
             * This is the important event
             * after Google redirects back.
             */

            if (
                event === "SIGNED_IN" &&
                session
            ) {

                console.log(
                    "Google sign-in completed."
                );


                handleAuthenticatedUser(
                    session
                );


                return;

            }


            /*
             * Supabase also sends the
             * current session through
             * INITIAL_SESSION.
             */

            if (
                event === "INITIAL_SESSION" &&
                session
            ) {

                console.log(
                    "Existing session restored."
                );


                handleAuthenticatedUser(
                    session
                );


                return;

            }


            /*
             * Token refresh does not require
             * a redirect.
             */

            if (
                event === "TOKEN_REFRESHED" &&
                session
            ) {

                handleAuthenticatedUser(
                    session
                );

            }

        }
    );


/* =================================================
   INITIAL SESSION CHECK
================================================= */

async function initializeEntrance() {

    console.log(
        "Loading Supabase session..."
    );


    /*
     * getSession() reads the persisted
     * browser session.
     *
     * We deliberately do NOT call
     * getUser() here.
     */

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Session loading error:",
            error
        );


        /*
         * Do not immediately redirect.
         *
         * The auth listener may still
         * receive the OAuth session.
         */

        return;

    }


    if (
        data &&
        data.session
    ) {

        console.log(
            "Session already available."
        );


        handleAuthenticatedUser(
            data.session
        );


        return;

    }


    /*
     * No session at this exact moment.
     *
     * This is NOT an instruction to
     * redirect to login.
     */

    console.log(
        "No session available yet. Waiting for Supabase authentication event..."
    );

}


/* =================================================
   START
================================================= */

initializeEntrance();

</script>


</body>

</html>
