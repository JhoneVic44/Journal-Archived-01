<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        The Unspoken Chapters | JhoneVic's Diary
    </title>

    <meta
        name="description"
        content="The entrance to The Unspoken Chapters, a personal diary archive."
    >


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background: #0b0c0d;

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           ENTRANCE
        ========================== */

        .entrance {

            position: relative;

            width: 100%;

            height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            padding:
                0 8% 200px;

            background:

                linear-gradient(
                    to top,
                    rgba(0,0,0,0.94),
                    rgba(0,0,0,0.35) 55%,
                    rgba(0,0,0,0.05)
                ),

                radial-gradient(
                    circle at 72% 18%,
                    #3a3c3e,
                    #202224 35%,
                    #0b0c0d 72%
                );
        }


        /* =========================
           SUBTLE LIGHT
        ========================== */

        .entrance::before {

            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            top: -420px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.03) 45%,
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================
           TOP RIGHT ACTIONS
        ========================== */

        .top-actions {

            position: absolute;

            top: 28px;

            right: 8%;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 12px;
        }


        /* =========================
           GOOGLE USER NAME
        ========================== */

        .user-name {

            color: #eeeae1;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.4s ease;
        }


        .user-name.visible {

            opacity: 1;
        }


        /* =========================
           LOGOUT BUTTON
        ========================== */

        .logout-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 72px;

            padding:
                8px 15px;

            border:
                1px solid
                rgba(255,255,255,0.27);

            background:
                rgba(255,255,255,0.035);

            color: #aaa8a2;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 8px;

            font-weight: 500;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                color 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }


        .logout-button:hover {

            color: #eeeae1;

            border-color:
                rgba(255,255,255,0.6);

            background:
                rgba(255,255,255,0.08);

            box-shadow:
                0 0 16px
                rgba(255,255,255,0.12);

            transform:
                translateY(-1px);
        }


        .logout-button:active {

            transform:
                translateY(0);
        }


        .logout-button:disabled {

            opacity: 0.5;

            cursor: wait;

            transform: none;
        }


        /* =========================
           CONTENT
        ========================== */

        .entrance-content {

            position: relative;

            z-index: 2;

            max-width: 700px;
        }


        .archive-label {

            margin-bottom: 18px;

            color: #aaa9a3;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        h1 {

            margin:
                0 0 38px;

            color: #eeeae1;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(
                    52px,
                    8vw,
                    90px
                );

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -0.06em;
        }


        /* =========================
           2013 BUTTON
        ========================== */

        .year-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 145px;

            padding:
                14px 32px;

            border:
                1px solid
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.035);

            color: #eeeae1;

            text-decoration: none;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .year-button:hover {

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.65);

            transform:
                translateY(-2px);
        }


        .year-button:active {

            transform:
                translateY(0);
        }


        /* =========================
           SMALL ARCHIVE MARK
        ========================== */

        .archive-mark {

            position: absolute;

            right: 8%;

            bottom: 72px;

            z-index: 2;

            color: #5d5f62;

            font-size: 8px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            writing-mode:
                vertical-rl;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            html,
            body {

                height: 100%;

                overflow: hidden;
            }


            .entrance {

                height: 100vh;

                min-height: 100vh;

                padding:
                    0 25px 70px;

                align-items: flex-end;
            }


            .top-actions {

                top: 20px;

                right: 25px;

                gap: 8px;

                max-width: 72%;
            }


            .user-name {

                max-width: 150px;

                overflow: hidden;

                text-overflow: ellipsis;

                font-size: 8px;

                letter-spacing: 0.10em;
            }


            .logout-button {

                min-width: 62px;

                padding:
                    7px 11px;

                font-size: 7px;

                letter-spacing: 0.15em;
            }


            .entrance-content {

                width: 100%;

                max-width: 100%;
            }


            .archive-label {

                margin-bottom: 16px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            h1 {

                margin-bottom: 32px;

                max-width: 360px;

                font-size:
                    clamp(
                        48px,
                        14vw,
                        70px
                    );

                line-height: 0.92;

                letter-spacing: -0.055em;
            }


            .year-button {

                min-width: 130px;

                padding:
                    13px 27px;

                font-size: 8px;

                letter-spacing: 0.25em;
            }


            .archive-mark {

                right: 20px;

                bottom: 55px;

                font-size: 7px;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 430px) {

            .entrance {

                padding:
                    0 20px 70px;
            }


            .top-actions {

                top: 17px;

                right: 20px;

                gap: 6px;
            }


            .user-name {

                max-width: 120px;

                font-size: 7px;
            }


            .logout-button {

                min-width: 57px;

                padding:
                    6px 9px;

                font-size: 6px;
            }


            .archive-label {

                font-size: 7px;
            }


            h1 {

                font-size:
                    clamp(
                        44px,
                        14vw,
                        60px
                    );

                margin-bottom: 28px;
            }


            .year-button {

                min-width: 120px;

                padding:
                    12px 24px;

                font-size: 8px;
            }


            .archive-mark {

                right: 15px;

                bottom: 45px;
            }

        }

    </style>

</head>


<body>


<main class="entrance">


    <!-- =========================
         TOP RIGHT ACTIONS
    ========================== -->

    <div
        class="top-actions"
        id="topActions"
    >

        <div
            class="user-name"
            id="user-name"
        ></div>


        <button
            type="button"
            class="logout-button"
            id="logoutButton"
            aria-label="Log out"
        >
            Logout
        </button>

    </div>


    <!-- =========================
         CONTENT
    ========================== -->

    <div class="entrance-content">


        <div class="archive-label">

            Personal Archive

        </div>


        <h1>

            The Unspoken<br>
            Chapters

        </h1>


        <a
            class="year-button"
            href="./2013.html"
            id="yearButton"
        >

            2013

        </a>


    </div>


    <div class="archive-mark">

        JhoneVic's Diary

    </div>


</main>



<!-- =========================
     SUPABASE AUTHENTICATION
========================== -->

<script>

/*
====================================================
 SUPABASE CONFIGURATION
====================================================
*/

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


/*
====================================================
 SUPABASE STORAGE KEY
====================================================

 IMPORTANT:

 This is the standard storage key for this
 Supabase project.

 Keeping it explicitly identical prevents
 different pages from accidentally using
 different authentication storage.
*/

const SUPABASE_STORAGE_KEY =
    "sb-ktytetimukmaqkxmzkha-auth-token";


/*
====================================================
 CREATE SUPABASE CLIENT
====================================================
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {

            auth: {

                persistSession: true,

                autoRefreshToken: true,

                detectSessionInUrl: true,

                storage:
                    window.localStorage,

                storageKey:
                    SUPABASE_STORAGE_KEY

            }

        }
    );


/*
====================================================
 ELEMENTS
====================================================
*/

const userNameElement =
    document.getElementById(
        "user-name"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/*
====================================================
 STATE
====================================================
*/

/*
 * This is extremely important.
 *
 * We do NOT immediately redirect when Supabase
 * reports an empty session during startup.
 *
 * The browser may still be restoring the session.
 */

let authenticationInitialized =
    false;


let authenticated =
    false;


let loggingOut =
    false;


let redirecting =
    false;


/*
====================================================
 DISPLAY USER
====================================================
*/

function displayUserName(user) {

    if (
        !user ||
        !userNameElement
    ) {

        return;

    }


    const metadata =
        user.user_metadata || {};


    let fullName =
        metadata.full_name ||
        metadata.name ||
        metadata.display_name ||
        metadata.displayName ||
        "";


    /*
     * Fallback to identity information.
     */

    if (!fullName) {

        const identities =
            user.identities || [];


        for (
            const identity of identities
        ) {

            const identityData =
                identity.identity_data || {};


            fullName =
                identityData.full_name ||
                identityData.name ||
                identityData.display_name ||
                identityData.displayName ||
                "";


            if (fullName) {

                break;

            }

        }

    }


    /*
     * Final fallback.
     */

    if (!fullName && user.email) {

        fullName =
            user.email;

    }


    if (fullName) {

        userNameElement.textContent =
            fullName;

        userNameElement.classList.add(
            "visible"
        );

    }

}


/*
====================================================
 SHOW AUTHENTICATED PAGE
====================================================
*/

function showAuthenticatedPage(session) {

    if (
        !session ||
        !session.user
    ) {

        return false;

    }


    authenticated =
        true;


    displayUserName(
        session.user
    );


    console.log(
        "ENTRANCE: authenticated",
        session.user.id
    );


    return true;

}


/*
====================================================
 REDIRECT TO LOGIN
====================================================
*/

function redirectToLogin() {

    if (
        redirecting ||
        loggingOut
    ) {

        return;

    }


    redirecting =
        true;


    console.log(
        "ENTRANCE: redirecting to login"
    );


    window.location.replace(
        "./login.html"
    );

}


/*
====================================================
 LOGOUT
====================================================
*/

if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        async function () {

            if (
                logoutButton.disabled ||
                loggingOut
            ) {

                return;

            }


            loggingOut =
                true;


            logoutButton.disabled =
                true;


            logoutButton.textContent =
                "Logging out...";


            console.log(
                "ENTRANCE: logout requested"
            );


            try {

                const {
                    error
                } =
                    await supabaseClient.auth.signOut();


                if (error) {

                    console.error(
                        "ENTRANCE: logout failed",
                        error
                    );


                    loggingOut =
                        false;


                    logoutButton.disabled =
                        false;


                    logoutButton.textContent =
                        "Logout";


                    alert(
                        "Unable to log out.\n\n" +
                        error.message
                    );


                    return;

                }


                console.log(
                    "ENTRANCE: logout successful"
                );


                /*
                 * Do NOT manually remove the
                 * Supabase localStorage key.
                 *
                 * Supabase has already handled it.
                 */


                window.location.replace(
                    "./login.html"
                );

            } catch (error) {

                console.error(
                    "ENTRANCE: unexpected logout error",
                    error
                );


                loggingOut =
                    false;


                logoutButton.disabled =
                    false;


                logoutButton.textContent =
                    "Logout";


                alert(
                    "Unable to log out.\n\n" +
                    error.message
                );

            }

        }
    );

}


/*
====================================================
 AUTH STATE CHANGE LISTENER
====================================================

 IMPORTANT:

 We do NOT immediately redirect on SIGNED_OUT.

 During startup, Supabase can still be initializing.

 We only react to SIGNED_OUT after the initial
 authentication state has been established.
*/

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        console.log(
            "ENTRANCE AUTH EVENT:",
            event,
            session ? "SESSION EXISTS" : "NO SESSION"
        );


        /*
         * A valid session was received.
         */

        if (session && session.user) {

            showAuthenticatedPage(
                session
            );

            return;

        }


        /*
         * Ignore empty-session events while
         * Supabase is still initializing.
         */

        if (
            !authenticationInitialized
        ) {

            console.log(
                "ENTRANCE: ignoring empty session during initialization"
            );

            return;

        }


        /*
         * Only after initialization has completed
         * should SIGNED_OUT be treated as a real logout.
         */

        if (
            event === "SIGNED_OUT"
        ) {

            authenticated =
                false;


            if (!loggingOut) {

                redirectToLogin();

            }

        }

    }
);


/*
====================================================
 GET CURRENT SESSION
====================================================
*/

async function getCurrentSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "ENTRANCE: getSession error",
                error
            );


            return null;

        }


        return (
            data &&
            data.session
        )
            ? data.session
            : null;

    } catch (error) {

        console.error(
            "ENTRANCE: unexpected getSession error",
            error
        );


        return null;

    }

}


/*
====================================================
 INITIALIZE AUTHENTICATION
====================================================
*/

async function initializeEntrance() {

    console.log(
        "ENTRANCE: starting authentication check"
    );


    /*
     * First check.
     */

    let session =
        await getCurrentSession();


    /*
     * If the session is already available,
     * stay on the page immediately.
     */

    if (session) {

        showAuthenticatedPage(
            session
        );


        authenticationInitialized =
            true;


        console.log(
            "ENTRANCE: session restored immediately"
        );


        return;

    }


    /*
     * Supabase may still be processing the
     * OAuth/session restoration.
     *
     * Wait before deciding that the user is
     * actually logged out.
     */

    console.log(
        "ENTRANCE: no session yet; waiting for Supabase"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                2500
            )
    );


    /*
     * Second check.
     */

    session =
        await getCurrentSession();


    if (session) {

        showAuthenticatedPage(
            session
        );


        authenticationInitialized =
            true;


        console.log(
            "ENTRANCE: session restored after first wait"
        );


        return;

    }


    /*
     * Give the browser another opportunity.
     */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                2500
            )
    );


    /*
     * Third check.
     */

    session =
        await getCurrentSession();


    if (session) {

        showAuthenticatedPage(
            session
        );


        authenticationInitialized =
            true;


        console.log(
            "ENTRANCE: session restored after second wait"
        );


        return;

    }


    /*
     * At this point initialization is complete.
     *
     * Only NOW do we allow a missing session
     * to mean that the user is logged out.
     */

    authenticationInitialized =
        true;


    console.log(
        "ENTRANCE: authentication initialization complete"
    );


    /*
     * One final check after initialization.
     */

    session =
        await getCurrentSession();


    if (session) {

        showAuthenticatedPage(
            session
        );


        return;

    }


    /*
     * No session after all checks.
     *
     * The user is genuinely unauthenticated.
     */

    console.log(
        "ENTRANCE: no authenticated session found"
    );


    redirectToLogin();

}


/*
====================================================
 START
====================================================
*/

initializeEntrance();

</script>


</body>

</html>
