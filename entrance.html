<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unspoken Chapters | JhoneVic's Diary</title>

    <meta name="description" content="The entrance to The Unspoken Chapters, a personal diary archive.">

    <!-- =========================
         SUPABASE
    ========================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =========================
         FONTS
    ========================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #0b0c0d;
            color: #eeeae1;
            font-family: "Manrope", Arial, sans-serif;
        }

        .entrance {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.94), rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.05)),
                        radial-gradient(circle at 72% 18%, #3a3c3e, #202224 35%, #0b0c0d 72%);
        }

        /* --- OVERLAPPING GLOW --- */
        .entrance::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,.04), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .left-column, .right-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 8%;
            overflow-y: auto;
        }

        .left-column .content,
        .right-column .content {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- USER NAME --- */
        .user-name {
            color: #eeeae1;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            position: absolute;
            top: 28px;
            right: 8%;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-name.visible {
            opacity: 1;
        }

        .user-name .avatar {
            font-size: 12px;
        }

        .archive-label {
            color: #aaa9a3;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1, .right-title {
            margin: 0 0 12px 0;
            color: #eeeae1;
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(44px, 6vw, 72px);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.06em;
        }

        .right-title { text-align: center; }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255,215,0,.15);
            margin: 10px auto 20px auto;
        }

        .subtitle {
            color: #888;
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.6;
            margin: 0 auto 25px auto;
        }

        .ai-intro {
            color: #888;
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.6;
            margin: 0 auto 30px auto;
        }

        .year-button,
        .enter-ai-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 145px;
            height: 46px;
            padding: 0 20px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.035);
            color: #eeeae1;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
            border-radius: 4px;
            margin: 0 auto;
            white-space: nowrap;
        }

        .year-button:hover,
        .enter-ai-btn:hover {
            background: rgba(255,255,255,0.11);
            border-color: rgba(255,255,255,0.65);
            transform: translateY(-2px);
        }

        .enter-ai-btn .icon {
            font-size: 14px;
            line-height: 1;
            flex-shrink: 0;
        }

        .enter-ai-btn .arrow {
            font-size: 11px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .enter-ai-btn:hover .arrow {
            transform: translateX(4px);
        }

        /* =================================================
                   MOBILE VERSION - FULL SCREEN
                ================================================= */

        @media (max-width: 900px) {
            html, body {
                overflow: hidden;
                height: 100%;
            }

            .entrance {
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 20px 20px 20px 20px;
                gap: 0;
                overflow: hidden;
            }

            .entrance::after { display: none; }

            .left-column,
            .right-column {
                flex: 1;
                padding: 0;
                justify-content: center;
                overflow-y: auto;
                min-height: 0;
            }

            .left-column {
                border-bottom: 1px solid rgba(255,255,255,.06);
                padding-bottom: 15px;
                margin-bottom: 0;
                flex: 1;
            }

            .right-column {
                padding-top: 15px;
                flex: 1;
            }

            .left-column .content,
            .right-column .content {
                max-width: 100%;
                padding: 0 5px;
                justify-content: center;
                height: 100%;
            }

            .user-name {
                position: absolute;
                top: 16px;
                right: 20px;
                font-size: 8px;
                margin-bottom: 0;
            }

            h1, .right-title {
                font-size: clamp(28px, 8vw, 38px);
                line-height: 0.95;
                margin-bottom: 8px;
            }

            .archive-label {
                font-size: 8px;
                margin-bottom: 12px;
                letter-spacing: 0.25em;
            }

            .subtitle,
            .ai-intro {
                font-size: 13px;
                line-height: 1.5;
                margin-bottom: 18px;
                max-width: 100%;
                padding: 0 5px;
            }

            .divider {
                width: 30px;
                margin: 6px auto 14px auto;
            }

            .year-button,
            .enter-ai-btn {
                min-width: 120px;
                height: 40px;
                padding: 0 16px;
                font-size: 8px;
                gap: 6px;
                letter-spacing: 0.2em;
            }

            .enter-ai-btn .icon { font-size: 12px; }
            .enter-ai-btn .arrow { font-size: 10px; }
        }

        @media (max-width: 480px) {
            .entrance { padding: 15px 15px 15px 15px; }

            .left-column { padding-bottom: 12px; flex: 1; }
            .right-column { padding-top: 12px; flex: 1; }

            h1, .right-title {
                font-size: clamp(24px, 8vw, 32px);
                margin-bottom: 6px;
            }

            .subtitle,
            .ai-intro {
                font-size: 12px;
                margin-bottom: 14px;
                line-height: 1.4;
            }

            .year-button,
            .enter-ai-btn {
                min-width: 110px;
                height: 36px;
                padding: 0 12px;
                font-size: 7px;
                gap: 5px;
                letter-spacing: 0.18em;
            }

            .enter-ai-btn .icon { font-size: 11px; }
            .enter-ai-btn .arrow { font-size: 9px; }

            .archive-label {
                font-size: 7px;
                margin-bottom: 8px;
                letter-spacing: 0.2em;
            }

            .divider {
                width: 25px;
                margin: 4px auto 10px auto;
            }

            .user-name {
                font-size: 7px;
                top: 12px;
                right: 15px;
            }
        }

        @media (max-width: 380px) {
            .entrance { padding: 12px 12px 12px 12px; }

            .left-column { padding-bottom: 10px; flex: 1; }
            .right-column { padding-top: 10px; flex: 1; }

            h1, .right-title {
                font-size: clamp(20px, 7vw, 26px);
                margin-bottom: 4px;
            }

            .subtitle,
            .ai-intro {
                font-size: 11px;
                margin-bottom: 12px;
            }

            .year-button,
            .enter-ai-btn {
                min-width: 100px;
                height: 32px;
                padding: 0 10px;
                font-size: 7px;
                gap: 4px;
                letter-spacing: 0.15em;
            }

            .enter-ai-btn .icon { font-size: 10px; }
            .enter-ai-btn .arrow { font-size: 8px; }

            .archive-label {
                font-size: 6px;
                margin-bottom: 6px;
            }

            .divider {
                width: 20px;
                margin: 3px auto 8px auto;
            }
        }

        .left-column::-webkit-scrollbar,
        .right-column::-webkit-scrollbar {
            width: 3px;
        }
        .left-column::-webkit-scrollbar-track,
        .right-column::-webkit-scrollbar-track {
            background: transparent;
        }
        .left-column::-webkit-scrollbar-thumb,
        .right-column::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.15);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="entrance">
        <!-- LEFT COLUMN -->
        <div class="left-column">
            <div class="content">
                <div class="user-name" id="userName">
                    <span class="avatar">👤</span>
                    <span id="userNameText">Loading...</span>
                </div>
                <div class="archive-label">Personal Archive</div>
                <h1>The Unspoken<br>Chapters</h1>
                <div class="divider"></div>
                <p class="subtitle">A collection of personal diary entries from 2013. Explore the past, one entry at a time.</p>
                <a class="year-button" href="./2013.html">2013</a>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="right-column">
            <div class="content">
                <div class="archive-label">AI Archive</div>
                <div class="right-title">The Unspoken<br>Chapters</div>
                <div class="divider"></div>
                <p class="ai-intro">Ask the archive anything about your diary entries — people, places, feelings, or specific moments.</p>
                <a class="enter-ai-btn" href="./ai-chat.html">
                    <span class="icon">✦</span> Enter AI <span class="arrow">→</span>
                </a>
            </div>
        </div>
    </div>

    <!-- =========================
         SUPABASE SCRIPT
    ========================== -->
    <script>
        // =================================================
        // SUPABASE CONFIGURATION
        // =================================================

        const SUPABASE_URL = "https://ktytetimukmaqkxmzkha.supabase.co";
        const SUPABASE_KEY = "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage
            }
        });

        // =================================================
        // DISPLAY USER NAME - UPDATED VERSION
        // =================================================

        async function displayUserName() {
            const userNameText = document.getElementById('userNameText');
            const userNameContainer = document.getElementById('userName');
            
            if (!userNameText || !userNameContainer) {
                console.error('User name elements not found!');
                return;
            }

            try {
                // Get the current session
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) {
                    console.error('Session error:', error);
                    userNameText.textContent = 'User';
                    userNameContainer.classList.add('visible');
                    return;
                }
                
                if (session && session.user) {
                    const user = session.user;
                    
                    console.log('User object:', user);
                    console.log('User metadata:', user.user_metadata);
                    
                    // Try ALL possible locations for the name
                    let fullName = 
                        // From user_metadata
                        user.user_metadata?.full_name || 
                        user.user_metadata?.name || 
                        user.user_metadata?.display_name ||
                        user.user_metadata?.displayName ||
                        user.user_metadata?.username ||
                        // From identities (Google login often puts it here)
                        (user.identities && user.identities[0]?.identity_data?.full_name) ||
                        (user.identities && user.identities[0]?.identity_data?.name) ||
                        (user.identities && user.identities[0]?.identity_data?.display_name) ||
                        // From email as last resort
                        user.email?.split('@')[0] ||
                        'User';
                    
                    console.log('Extracted name:', fullName);
                    
                    userNameText.textContent = fullName;
                    userNameContainer.classList.add('visible');
                } else {
                    console.log('No session - user not logged in');
                    userNameText.textContent = 'Guest';
                    userNameContainer.classList.add('visible');
                }
            } catch (error) {
                console.error('Unexpected error:', error);
                userNameText.textContent = 'User';
                userNameContainer.classList.add('visible');
            }
        }

        // =================================================
        // AUTH STATE CHANGE LISTENER
        // =================================================

        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log('Auth event:', event);
            console.log('Session:', session);
            
            if (event === 'SIGNED_IN' || event === 'USER_UPDATED' || event === 'INITIAL_SESSION') {
                // Wait a moment for the session to fully load
                setTimeout(displayUserName, 100);
            } else if (event === 'SIGNED_OUT') {
                const userNameText = document.getElementById('userNameText');
                const userNameContainer = document.getElementById('userName');
                if (userNameText && userNameContainer) {
                    userNameText.textContent = 'Guest';
                    userNameContainer.classList.add('visible');
                }
            }
        });

        // =================================================
        // CALL ON PAGE LOAD
        // =================================================

        document.addEventListener('DOMContentLoaded', function() {
            // Check for the URL hash that Supabase uses for OAuth
            const urlParams = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = urlParams.get('access_token');
            
            if (accessToken) {
                console.log('OAuth callback detected, setting session...');
                // Let Supabase handle the OAuth callback
                supabaseClient.auth.getSession().then(() => {
                    setTimeout(displayUserName, 200);
                });
            } else {
                displayUserName();
            }
        });

        // Also try again after a short delay to ensure session is fully loaded
        setTimeout(displayUserName, 500);
        setTimeout(displayUserName, 1000);
    </script>
</body>
</html>
