<!DOCTYPE html>
<html>
<head>
    <title>Supabase User Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>Supabase User Test</h1>

    <p id="result">Loading...</p>

    <script>

        const SUPABASE_URL =
            "https://ktytetimukmaqkxmzkha.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function testUser() {

            const result =
                document.getElementById("result");


            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            console.log("SESSION:", data);
            console.log("ERROR:", error);


            if (error) {

                result.textContent =
                    "ERROR: " +
                    error.message;

                return;
            }


            if (!data.session) {

                result.textContent =
                    "NO SESSION FOUND";

                return;
            }


            const user =
                data.session.user;


            const name =
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.user_metadata?.display_name ||
                "NO NAME FOUND";


            result.textContent =
                "NAME: " + name;

        }


        testUser();

    </script>

</body>
</html>
