    <style>

            box-sizing: border-box;

        html,
        body {

            margin: 0;

            height: 100%;

            overflow: hidden;

        body {

            z-index: 0;

            position: absolute;

            top: 0;

            height: 85px;

            color: #eeeae1;
        }

           PAGE
        ========================== */

            z-index: 2;

            width: 100%;

            padding-top: 85px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

            text-align: center;
        }


        .eyebrow {

            margin-bottom: 24px;

            color: #777a7d;

            font-weight: 600;

            text-transform: uppercase;

            font-size: 11px;

            line-height: 1.8;

           FORM

        .password-form {

            width: 100%;

            max-width: 320px;

            margin: 0 auto;
        }


        .field {

            width: 100%;

            margin-bottom: 14px;

            text-align: left;
        }


        .field label {

            display: block;

            margin-bottom: 7px;

            color: #777a7d;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 0.16em;

            text-transform: uppercase;
        }


        .field input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border:
                1px solid
                rgba(255,255,255,0.16);

            border-radius: 3px;

            outline: none;

            background:
                rgba(255,255,255,0.045);

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 12px;

            transition:
                border-color 0.25s ease,
                background 0.25s ease;
        }


        .field input::placeholder {

            color: #55585b;
        }


        .field input:focus {

            border-color:
                rgba(255,255,255,0.38);

            background:
                rgba(255,255,255,0.07);
        }


        /* =========================
           BUTTON
        ========================== */

        .update-button {

            width: 100%;

            height: 48px;

            margin-top: 8px;

            border:
                1px solid
                rgba(255,255,255,0.28);

            border-radius: 3px;

            background:
                rgba(255,255,255,0.10);

            color: #eeeae1;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.2s ease;
        }


        .update-button:hover {

            background:
                rgba(255,255,255,0.17);

            border-color:
                rgba(255,255,255,0.42);

            transform:
                translateY(-1px);
        }


        .update-button:active {

            transform:
                translateY(0);
        }


        .update-button:disabled {

            opacity: 0.5;

            cursor: wait;

            transform: none;
        }


        /* =========================
           MESSAGE
        ========================== */

        .message {

            min-height: 20px;

            margin:
                16px auto 0;

            color: #999b9d;

            font-size: 10px;

            line-height: 1.6;
        }


        .message.error {

            color: #c5a5a5;
        }


        .message.success {

            color: #a9bba9;
        }


        /* =========================
           NOTICE
        ========================== */

        .notice {

            max-width: 320px;

            margin:
                25px auto 0;

            color: #5d5f62;

            font-size: 9px;

        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            position: fixed;

            left: 7%;

            bottom: 28px;

            z-index: 6;

            color: #5d5f62;

            font-size: 9px;

            letter-spacing: 0.2em;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            html,
            body {

                width: 100%;

                min-height: 100%;

                height: auto;

                overflow-x: hidden;

                overflow-y: auto;
            }


            nav {

                position: relative;

                top: auto;
                left: auto;
                right: auto;

                width: 100%;

                height: auto;

                padding:
                    22px 20px 18px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: flex-start;

                gap: 18px;

                background:
                    rgba(11,12,13,0.97);

                backdrop-filter:
                    blur(10px);

                -webkit-backdrop-filter:
                    blur(10px);
            }


            .logo {

                width: 100%;

                text-align: center;

                font-size: 11px;

                line-height: 1.4;
            }


            .links {

                width: 100%;

                display: flex;

                flex-wrap: wrap;

                align-items: center;

                justify-content: center;

                gap:
                    12px 18px;
            }


            .links a {

                display: inline-block;

                padding:
                    3px 0;

                font-size: 9px;

                line-height: 1.5;
            }


            main {

                width: 100%;

                height: auto;

                min-height:
                    calc(100vh - 110px);

                padding-top: 0;
            }


            .password-page {

                padding:
                    55px 25px 90px;
            }


            h1 {

                font-size:
                    clamp(
                        46px,
                        13vw,
                        64px
                    );
            }


            .description {

                max-width: 290px;

                font-size: 12px;
            }


            footer {

                position: relative;

                left: auto;

                bottom: auto;

                width: 100%;

                    0 25px 30px;

                text-align: center;

        /* =========================

        ========================== */

        @media (max-width: 430px) {

                min-height:
                    calc(100vh - 105px);
            }

                padding:

            }


            h1 {

                    clamp(

            .eyebrow {

            }

            }

    </style>

</head>


<body>


<div class="background"></div>


<!-- =========================
     NAVIGATION
========================== -->

<nav>

    <div class="logo">

        JhoneVic's Diary

    </div>


    <div class="links">

        <a href="./index.html">
            Home
        </a>


        <a href="./introduction.html">
            Introduction
        </a>


        <a href="./reflections.html">
            Reflection | Photographs
        </a>

            Timeline
        </a>


        <a href="./login.html">

        </a>

    </div>

<!-- =========================
     PASSWORD UPDATE
========================== -->

<main>

    <section class="password-page">

        <div class="eyebrow">
            The Archive
        </div>


        <h1>
            Set Your<br>
            Password
        </h1>


        <div class="rule"></div>


        <p class="description">
            Create a password for your
            private family archive account.
        </p>


        <form
            class="password-form"
            id="password-form"
        >


            <div class="field">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Enter your new password"
                    minlength="8"
                    required
                >

            </div>


            <div class="field">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    autocomplete="new-password"
                    placeholder="Confirm your new password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="update-button"
                id="update-button"
            >

                <span id="update-button-text">
                    Set Password
                </span>

            </button>


            <div
                class="message"
                id="password-message"
                aria-live="polite"
            ></div>


        </form>


        <p class="notice">
            Your password is used only for
            your private archive account.
        </p>

    </section>

</main>


<footer>
    Personal Archive · 2013—2026
</footer>


<!-- =========================
     SUPABASE PASSWORD UPDATE
========================== -->

<script>

const SUPABASE_URL =
    "https://ktytetimukmaqkxmzkha.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SpdBWTILWEJbkFpZj-FUjw_ljr1I8K";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


const passwordForm =
    document.getElementById(
        "password-form"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirm-password"
    );


const updateButton =
    document.getElementById(
        "update-button"
    );


const updateButtonText =
    document.getElementById(
        "update-button-text"
    );


const passwordMessage =
    document.getElementById(
        "password-message"
    );


/*
 * Display a message.
 */

function showMessage(
    message,
    type = ""
) {

    passwordMessage.textContent =
        message;

    passwordMessage.className =
        "message " + type;

}


/*
 * Check whether the password-reset
 * session is available.
 */

async function checkRecoverySession() {

    console.log(
        "Checking password recovery session..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Recovery session error:",
            error
        );

        showMessage(
            "This password-reset link is invalid or has expired.",
            "error"
        );

        updateButton.disabled = true;

        return;

    }


    if (
        !data ||
        !data.session
    ) {

        console.warn(
            "No recovery session found."
        );

        showMessage(
            "This password-reset link is invalid or has expired.",
            "error"
        );

        updateButton.disabled = true;

        return;

    }


    console.log(
        "Recovery session found."
    );

}


/*
 * Update the password.
 */

passwordForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        showMessage("");


        if (
            password.length < 8
        ) {

            showMessage(
                "Your password must be at least 8 characters.",
                "error"
            );

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "The passwords do not match.",
                "error"
            );

            return;

        }


        updateButton.disabled = true;

        updateButtonText.textContent =
            "Saving...";


        console.log(
            "Updating Supabase password..."
        );


        const {
            data,
            error
        } =
            await supabaseClient.auth.updateUser({

                password:
                    password

            });


        if (error) {

            console.error(
                "Password update error:",
                error
            );


            updateButton.disabled = false;

            updateButtonText.textContent =
                "Set Password";


            showMessage(
                error.message,
                "error"
            );

            return;

        }


        console.log(
            "Password successfully updated.",
            data
        );


        showMessage(
            "Password created successfully.",
            "success"
        );


        updateButtonText.textContent =
            "Password Set";


        /*
         * Give the user a moment to see
         * the success message before returning
         * to the login page.
         */

        setTimeout(
            function () {

                supabaseClient.auth.signOut();

                window.location.replace(
                    "./login.html"
                );

            },
            1800
        );

    }
);


/*
 * Supabase can emit PASSWORD_RECOVERY
 * when the recovery link is opened.
 */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        console.log(
            "Password page auth event:",
            event
        );


        if (
            event ===
            "PASSWORD_RECOVERY"
        ) {

            console.log(
                "Password recovery session detected."
            );

        }

    }
);


/*
 * Start by checking the recovery session.
 */

checkRecoverySession();

</script>


</body>
