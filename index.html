<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JhoneVic's Diary</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            background: #faf9f6;

            color: #171717;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        .page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            padding:
                60px 8vw;
        }


        .content {

            width: 100%;

            max-width: 720px;

            text-align: left;
        }


        .small-label {

            margin-bottom: 24px;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            color: #888;
        }


        .title {

            margin: 0;

            font-size:
                clamp(
                    52px,
                    7vw,
                    92px
                );

            font-weight: 600;

            line-height: 0.95;

            letter-spacing:
                -0.055em;
        }


        .diary {

            margin-top: 18px;

            font-size:
                clamp(
                    19px,
                    2.5vw,
                    30px
                );

            font-weight: 500;

            letter-spacing:
                0.32em;

            text-transform: uppercase;

            color: #555;
        }


        .line {

            width: 100%;

            max-width: 620px;

            height: 1px;

            margin-top: 42px;

            background: #d8d6d1;
        }


        .description {

            max-width: 480px;

            margin-top: 25px;

            font-size: 15px;

            line-height: 1.8;

            color: #777;
        }


        .number {

            margin-top: 45px;

            font-size: 11px;

            letter-spacing: 0.16em;

            color: #999;
        }


        @media (max-width: 700px) {

            .page {

                padding:
                    40px 25px;
            }


            .small-label {

                margin-bottom: 20px;

                font-size: 10px;
            }


            .title {

                font-size:
                    clamp(
                        46px,
                        13vw,
                        70px
                    );
            }


            .diary {

                margin-top: 15px;

                font-size: 17px;

                letter-spacing:
                    0.24em;
            }


            .line {

                margin-top: 35px;
            }


            .description {

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <div class="content">


            <div class="small-label">
                Personal Archive
            </div>


            <h1 class="title">
                JhoneVic's
            </h1>


            <div class="diary">
                Diary
            </div>


            <div class="line"></div>


            <p class="description">
                Memories, thoughts, experiences,
                and moments preserved through the years.
            </p>


            <div class="number">
                ARCHIVE / 01
            </div>


        </div>


    </main>


</body>

</html>
