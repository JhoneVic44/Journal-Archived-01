<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JhoneVic's Diary</title>


    <!-- Manrope -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #ffffff 0%,
                    #faf9f6 45%,
                    #eeeae3 100%
                );

            color: #1c1c1c;

            font-family:
                "Manrope",
                Arial,
                sans-serif;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {

            min-height: 100vh;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            padding:
                28px 45px;

            display: grid;

            grid-template-columns:
                1fr auto 1fr;

            align-items: center;

            z-index: 10;
        }


        .left-navigation {

            display: flex;

            align-items: center;

            gap: 28px;

            justify-content: flex-start;
        }


        .right-navigation {

            display: flex;

            justify-content: flex-end;
        }


        .navigation a {

            color: #333;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

            letter-spacing:
                0.12em;

            text-transform: uppercase;

            transition:
                opacity 0.2s ease;
        }


        .navigation a:hover {

            opacity: 0.5;
        }


        .login-button {

            padding:
                9px 19px;

            border:
                1px solid #333;

            border-radius: 999px;

            background: transparent;

            color: #333;

            font-family:
                "Manrope",
                Arial,
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing:
                0.12em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .login-button:hover {

            background: #222;

            color: #fff;
        }


        /* =========================
           CENTER TITLE
        ========================= */

        .hero {

            position: relative;

            z-index: 2;

            text-align: center;

            padding:
                30px 25px;
        }


        .eyebrow {

            margin-bottom: 24px;

            color: #888;

            font-size: 11px;

            font-weight: 600;

            letter-spacing:
                0.28em;

            text-transform: uppercase;
        }


        .title {

            margin: 0;

            font-size:
                clamp(
                    52px,
                    8vw,
                    105px
                );

            font-weight: 600;

            line-height: 0.95;

            letter-spacing:
                -0.065em;
        }


        .subtitle {

            max-width: 500px;

            margin:
                28px auto 0;

            color: #777;

            font-size: 15px;

            line-height: 1.8;

            font-weight: 400;
        }


        .decorative-line {

            width: 70px;

            height: 1px;

            margin:
                32px auto 0;

            background: #bdb9b1;
        }


        .archive-label {

            margin-top: 22px;

            color: #999;

            font-size: 10px;

            font-weight: 600;

            letter-spacing:
                0.2em;
        }


        /* =========================
           BACKGROUND DETAILS
        ========================= */

        .circle {

            position: absolute;

            width: 520px;

            height: 520px;

            border-radius: 50%;

            border:
                1px solid
                rgba(80, 75, 65, 0.08);

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);
        }


        .circle::before {

            content: "";

            position: absolute;

            width: 380px;

            height: 380px;

            border-radius: 50%;

            border:
                1px solid
                rgba(80, 75, 65, 0.06);

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            position: absolute;

            bottom: 25px;

            left: 0;

            width: 100%;

            text-align: center;

            color: #aaa;

            font-size: 10px;

            letter-spacing:
                0.16em;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .navigation {

                padding:
                    22px 20px;

                grid-template-columns:
                    1fr auto;

                grid-template-areas:
                    "left login";
            }


            .left-navigation {

                grid-area: left;

                gap: 18px;
            }


            .right-navigation {

                grid-area: login;
            }


            .navigation a,
            .login-button {

                font-size: 10px;

                letter-spacing:
                    0.08em;
            }


            .login-button {

                padding:
                    8px 14px;
            }


            .hero {

                padding:
                    90px 20px;
            }


            .eyebrow {

                font-size: 9px;

                letter-spacing:
                    0.2em;
            }


            .title {

                font-size:
                    clamp(
                        44px,
                        13vw,
                        70px
                    );
            }


            .subtitle {

                font-size: 14px;

                max-width: 340px;
            }


            .circle {

                width: 360px;

                height: 360px;
            }


            .circle::before {

                width: 270px;

                height: 270px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <!-- Decorative background -->

        <div class="circle"></div>


        <!-- Navigation -->

        <nav class="navigation">


            <div class="left-navigation">

                <a href="#">
                    About
                </a>

                <a href="#">
                    Timeline
                </a>

            </div>


            <!-- Empty center column keeps title perfectly centered -->


            <div></div>


            <div class="right-navigation">

                <button
                    class="login-button"
                    type="button"
                >
                    Login
                </button>

            </div>


        </nav>


        <!-- Main title -->

        <section class="hero">


            <div class="eyebrow">
                Personal Archive
            </div>


            <h1 class="title">
                JhoneVic's Diary
            </h1>


            <p class="subtitle">

                A personal collection of memories,
                thoughts, experiences, and moments
                preserved through the years.

            </p>


            <div class="decorative-line"></div>


            <div class="archive-label">
                2013 — 2026
            </div>


        </section>


        <!-- Footer -->

        <footer class="footer">

            JhoneVic's Personal Archive

        </footer>


    </main>


</body>

</html>
