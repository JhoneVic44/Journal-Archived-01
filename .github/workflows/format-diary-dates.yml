name: Update diary date display

on:
  push:
    paths:
      - '.github/workflows/format-diary-dates.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove year from diary entry dates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('2013.html')
          text = path.read_text(encoding='utf-8')
          old = 'item.innerHTML=`<div class="diary-date">${entry.date}</div><h3 class="diary-title"'
          new = 'item.innerHTML=`<div class="diary-date">${entry.date.replace(/,?\\s*2013$/, "")}</div><h3 class="diary-title"'
          if old not in text:
              raise SystemExit('Target render code was not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2013.html
          git rm .github/workflows/format-diary-dates.yml
          git commit -m "Remove year from diary entry dates"
          git push
